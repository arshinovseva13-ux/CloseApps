<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Close Counter</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:26px 16px;background:radial-gradient(ellipse at top,#482d4c,#100d16 65%);color:#fff5ff;font:16px system-ui}.wrap{max-width:650px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#d5b6dc}a{color:#e3aaff;text-decoration:none}h1{font-size:clamp(36px,8vw,58px);margin:22px 0 5px}.sub{color:#d5b6dc}.panel{margin-top:24px;padding:24px;background:#211628;border:1px solid #5c3c66;border-radius:24px;text-align:center}.label{color:#d5b6dc;font-size:13px;letter-spacing:.15em}.count{font-size:clamp(90px,24vw,150px);line-height:1.2;font-weight:850;letter-spacing:-.07em;margin:16px 0;overflow-wrap:anywhere}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:1px solid #684975;border-radius:14px;background:#392441;color:#fff5ff;padding:15px;font-size:18px;font-weight:800;cursor:pointer}.primary{background:#e3aaff;color:#291333;border-color:#e3aaff}.settings{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:18px;color:#d5b6dc}.settings input{width:90px;padding:9px;border:1px solid #684975;border-radius:10px;background:#130e18;color:white;font:inherit}.hint{font-size:13px;color:#d5b6dc;margin-top:18px}</style></head><body><main class="wrap"><div class="top"><b>CLOSE APPS / QUICK TOOL</b><a href="../">← На главную</a></div><h1>Close Counter</h1><p class="sub">Универсальный счётчик для тренировок, задач, очков и любых повторений.</p><section class="panel"><div class="label" id="label">ТЕКУЩЕЕ ЗНАЧЕНИЕ</div><div class="count" id="count" aria-live="polite">0</div><div class="buttons"><button class="btn primary" id="plus">＋ Увеличить</button><button class="btn" id="minus">− Уменьшить</button><button class="btn" id="reset">↺ Сброс</button><button class="btn" id="undo">↶ Отменить шаг</button></div><div class="settings"><label for="step">Шаг изменения</label><input id="step" type="number" min="1" max="100000" value="1"><label for="name">Название</label><input id="name" type="text" maxlength="24" placeholder="Например: повторы"></div><p class="hint" id="hint">Нажимай кнопки или используй клавиши + и −. Последнее значение сохраняется на этом устройстве.</p></section></main><script>const $=s=>document.querySelector(s);let count=Number(localStorage.getItem('closeCounterValue')||0),history=[];function render(){ $('#count').textContent=count.toLocaleString('ru-RU');$('#label').textContent=($('#name').value.trim()||'ТЕКУЩЕЕ ЗНАЧЕНИЕ').toLocaleUpperCase('ru-RU');try{localStorage.setItem('closeCounterValue',String(count))}catch{}}function change(sign){history.push(count);if(history.length>30)history.shift();let step=Math.max(1,Math.min(100000,Math.floor(Number($('#step').value)||1)));count+=sign*step;render()}$('#plus').onclick=()=>change(1);$('#minus').onclick=()=>change(-1);$('#reset').onclick=()=>{history.push(count);count=0;render()};$('#undo').onclick=()=>{if(history.length)count=history.pop();render()};$('#name').oninput=render;document.addEventListener('keydown',e=>{if(e.target.matches('input'))return;if(e.key==='+')change(1);if(e.key==='-')change(-1)});render();</script></body></html>
