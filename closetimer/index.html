<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Close Timer</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:26px 16px;background:radial-gradient(ellipse at top,#25355b,#0b0e18 65%);color:#f4f6ff;font:16px system-ui}.wrap{max-width:700px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#9eabc9}.panel{margin-top:24px;background:#151b2c;border:1px solid #303b59;border-radius:24px;padding:24px;text-align:center}h1{font-size:clamp(34px,8vw,54px);margin:20px 0 5px}.sub{color:#aab6d2}.time{font:800 clamp(58px,16vw,100px)/1.2 ui-monospace,monospace;letter-spacing:-.06em;margin:24px 0;color:#b7c5ff}.modes,.actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.button{border:1px solid #394666;border-radius:12px;background:#222c45;color:#f4f6ff;padding:11px 15px;font-weight:700;cursor:pointer}.button.active,.primary{background:#aab8ff;color:#11172a;border-color:#aab8ff}.hint{color:#9eabc9;font-size:13px;margin-top:18px}a{color:#b7c5ff;text-decoration:none}</style></head><body><main class="wrap"><div class="top"><b>CLOSE APPS / FOCUS</b><a href="../">← На главную</a></div><h1>Close Timer</h1><p class="sub">Таймер для фокусировки, коротких перерывов и работы по методу Pomodoro.</p><section class="panel"><div class="modes"><button class="button active" data-min="25">Фокус · 25 мин</button><button class="button" data-min="5">Перерыв · 5 мин</button><button class="button" data-min="15">Длинный перерыв · 15 мин</button></div><div class="time" id="time" role="timer">25:00</div><div class="actions"><button class="button primary" id="toggle">▶ Старт</button><button class="button" id="reset">↺ Сбросить</button></div><p class="hint" id="status" aria-live="polite">Выбери режим и нажми «Старт».</p></section></main><script>const time=document.querySelector('#time'),status=document.querySelector('#status'),toggle=document.querySelector('#toggle');let total=1500,left=1500,started=0,interval=null;function show(){time.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}function stop(){clearInterval(interval);interval=null;started=0;toggle.textContent='▶ Продолжить'}function tick(){left=Math.max(0,total-Math.floor((Date.now()-started)/1000));show();if(left===0){stop();toggle.textContent='▶ Старт';status.textContent='Время вышло! Отличная работа.';try{if('vibrate'in navigator)navigator.vibrate([200,100,200])}catch{}}}document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{stop();document.querySelectorAll('[data-min]').forEach(x=>x.classList.toggle('active',x===b));total=left=Number(b.dataset.min)*60;show();toggle.textContent='▶ Старт';status.textContent='Режим: '+b.textContent});toggle.onclick=()=>{if(interval){tick();stop();status.textContent='Таймер на паузе.';return}started=Date.now()-(total-left)*1000;interval=setInterval(tick,200);toggle.textContent='Ⅱ Пауза';status.textContent='Время пошло — сосредоточься на задаче.'};document.querySelector('#reset').onclick=()=>{stop();left=total;show();toggle.textContent='▶ Старт';status.textContent='Таймер сброшен.'};show();</script></body></html>
