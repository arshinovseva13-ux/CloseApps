name: Clause AI corpus validation

on:
  push:
    paths:
      - "datasets/clause-ai/importer/**"
      - "datasets/clause-ai/schema/**"
      - ".github/workflows/clause-ai-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install importer dependencies
        run: python -m pip install -r datasets/clause-ai/importer/requirements.txt
      - name: Compile importer
        run: python -m compileall -q datasets/clause-ai/importer
      - name: Run importer contract tests
        working-directory: datasets/clause-ai/importer
        run: python -m unittest discover -s tests -v
