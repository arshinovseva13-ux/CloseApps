name: Clause AI — FineWeb inventory

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: "Optional FineWeb source commit SHA (blank pins current main)"
        required: false
        type: string
  push:
    paths:
      - "datasets/clause-ai/mirror-fineweb/**"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout CloseApps
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install inventory dependencies
        run: pip install -r datasets/clause-ai/mirror-fineweb/requirements-mirror.txt

      - name: Build source inventory (metadata only; no dataset download)
        shell: bash
        run: |
          REVISION="${{ inputs.source_revision }}"
          if [ -n "$REVISION" ]; then
            python datasets/clause-ai/mirror-fineweb/mirror_fineweb.py inventory --workdir fineweb-mirror-work --revision "$REVISION"
          else
            python datasets/clause-ai/mirror-fineweb/mirror_fineweb.py inventory --workdir fineweb-mirror-work
          fi

      - name: Upload inventory artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clause-ai-fineweb-source-inventory
          path: fineweb-mirror-work/
          if-no-files-found: error
          retention-days: 30
