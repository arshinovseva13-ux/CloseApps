name: Clause AI unified corpus pilot

on:
  workflow_dispatch:
    inputs:
      records_per_source:
        description: "Pilot records per source (start small; 1000 recommended)"
        required: true
        default: "1000"
        type: string

permissions:
  contents: read

concurrency:
  group: clause-ai-unified-pilot
  cancel-in-progress: false

jobs:
  build-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: datasets/clause-ai/importer/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r datasets/clause-ai/importer/requirements.txt

      - name: Run merger regression tests
        run: python -m unittest discover -s datasets/clause-ai/tests -p "test_*.py" -v

      - name: Import a small batch from all approved sources
        env:
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python datasets/clause-ai/importer/import_external.py \
            --source all \
            --limit "${{ inputs.records_per_source }}" \
            --out ./clause-ai-import

      - name: Build the unified corpus
        run: |
          python datasets/clause-ai/importer/merge_corpus.py \
            --imports ./clause-ai-import \
            --foundations ./datasets/clause-ai/libraries/foundations \
            --out ./clause-ai-unified

      - name: Upload pilot for inspection (temporary, 7 days)
        uses: actions/upload-artifact@v4
        with:
          name: clause-ai-unified-pilot-${{ github.run_id }}
          path: |
            clause-ai-import/
            clause-ai-unified/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
