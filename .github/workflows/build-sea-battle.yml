name: Build Close Sea Battle installers
on:
  push:
    paths:
      - 'builds/sea-battle/package.json'
      - 'builds/sea-battle/capacitor.config.ts'
      - 'builds/sea-battle/scripts/**'
      - 'builds/sea-battle/electron/**'
      - 'builds/sea-battle/assets/**'
      - 'sea-battle.html'
      - '.github/workflows/build-sea-battle.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: builds/sea-battle/package.json }
      - name: Install dependencies
        working-directory: builds/sea-battle
        run: npm install
      - name: Build Windows installer
        working-directory: builds/sea-battle
        run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: builds/sea-battle/dist/*.exe
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: builds/sea-battle/package.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Install dependencies
        working-directory: builds/sea-battle
        run: npm install
      - name: Build Android APK
        working-directory: builds/sea-battle
        run: npm run build:android
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp builds/sea-battle/android/app/build/outputs/apk/debug/app-debug.apk dist/CloseSeaBattle-Android-1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error
  publish:
    runs-on: ubuntu-latest
    needs: [windows, android]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish direct-download release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sea-battle-v1.0.0
          name: Close Sea Battle 1.0.0
          body: |
            Первая установочная сборка Close Sea Battle.
            - Windows x64: EXE installer
            - Android: APK
            Страница прямого скачивания: https://arshinovseva13-ux.github.io/CloseApps/builds/sea-battle.html
          files: |
            dist/*.exe
            dist/*.apk
          make_latest: true
