# Build and deploy CloseApps static site, including the pinned Stockfish WASM engine.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download pinned Stockfish package
        run: |
          npm pack stockfish@19.0.1
          mkdir -p engine
          tar -xzf stockfish-19.0.1.tgz \
            package/bin/stockfish-19-lite-single.js \
            package/bin/stockfish-19-lite-single.wasm
          cp package/bin/stockfish-19-lite-single.js engine/
          cp package/bin/stockfish-19-lite-single.wasm engine/
          test -s engine/stockfish-19-lite-single.js
          test -s engine/stockfish-19-lite-single.wasm
          echo "Stockfish JS: $(wc -c < engine/stockfish-19-lite-single.js) bytes"
          echo "Stockfish WASM: $(wc -c < engine/stockfish-19-lite-single.wasm) bytes"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
