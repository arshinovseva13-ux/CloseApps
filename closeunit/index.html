<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Close Unit</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:26px 16px;background:radial-gradient(ellipse at top,#19464b,#0b1216 65%);color:#effffd;font:16px system-ui}.wrap{max-width:760px;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:#a5ceca}a{color:#8ce3d5;text-decoration:none}h1{font-size:clamp(36px,8vw,58px);margin:22px 0 5px}.sub{color:#a5ceca}.panel{margin-top:24px;padding:24px;background:#122326;border:1px solid #31595a;border-radius:22px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn,select,input{font:inherit;border-radius:12px;padding:12px;border:1px solid #31595a;background:#0c191b;color:#effffd}.btn{cursor:pointer}.btn.active{background:#8ce3d5;color:#0b2825}.fields{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;margin-top:20px}.fields label{font-size:13px;color:#a5ceca}.fields input,.fields select{display:block;width:100%;margin-top:7px}.swap{padding:10px;align-self:center}.result{margin-top:18px;padding:18px;background:#0c191b;border:1px solid #31595a;border-radius:16px}.result small{color:#a5ceca}.value{font-size:clamp(28px,7vw,44px);font-weight:800;overflow-wrap:anywhere;color:#8ce3d5}@media(max-width:520px){.fields{grid-template-columns:1fr}.swap{justify-self:center}}</style></head><body><main class="wrap"><div class="top"><b>CLOSE APPS / CONVERTER</b><a href="../">← На главную</a></div><h1>Close Unit</h1><p class="sub">Быстрый перевод единиц длины, массы, температуры и скорости. Без рекламы и лишних экранов.</p><section class="panel"><div class="tabs"><button class="btn active" data-kind="length">Длина</button><button class="btn" data-kind="mass">Масса</button><button class="btn" data-kind="temp">Температура</button><button class="btn" data-kind="speed">Скорость</button></div><div class="fields"><label>Значение<input id="amount" type="number" value="1" step="any"></label><button class="btn swap" id="swap" aria-label="Поменять единицы местами">⇄</button><label>Из единицы<select id="from"></select></label><label>В единицу<select id="to"></select></label></div><div class="result"><small>Результат</small><div class="value" id="result">100 см</div></div></section></main><script>const units={length:[['m','метр',1],['km','километр',1000],['cm','сантиметр',.01],['mm','миллиметр',.001],['mi','миля',1609.344],['ft','фут',.3048],['in','дюйм',.0254]],mass:[['kg','килограмм',1],['g','грамм',.001],['mg','миллиграмм',.000001],['lb','фунт',.45359237],['oz','унция',.0283495]],temp:[['C','°C'],['F','°F'],['K','Кельвин']],speed:[['ms','м/с',1],['kmh','км/ч',1/3.6],['mph','миля/ч',.44704],['knot','узел',.514444]]};let kind='length';const $=s=>document.querySelector(s);function fill(){for(const id of ['from','to']){$(id).innerHTML=units[kind].map(u=>'<option value="'+u[0]+'">'+u[1]+'</option>').join('')}$('#from').value=units[kind][0][0];$('#to').value=units[kind][1][0];calc()}function convert(v,a,b){if(kind==='temp'){let c=a==='C'?v:a==='F'?(v-32)*5/9:v-273.15;return b==='C'?c:b==='F'?c*9/5+32:c+273.15}return v*units[kind].find(x=>x[0]===a)[2]/units[kind].find(x=>x[0]===b)[2]}function calc(){let v=Number($('#amount').value);if($('#amount').value.trim()===''||!Number.isFinite(v)){$('#result').textContent='—';return}let out=convert(v,$('#from').value,$('#to').value);$('#result').textContent=Number(out.toPrecision(9)).toLocaleString('ru-RU',{maximumFractionDigits:8})+' '+$('#to').selectedOptions[0].textContent}document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));fill()});['amount','from','to'].forEach(id=>$('#'+id).addEventListener('input',calc));$('#swap').onclick=()=>{let a=$('#from').value;$('#from').value=$('#to').value;$('#to').value=a;calc()};fill();</script></body></html>
