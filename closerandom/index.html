<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131f"><title>Close Random</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;background:radial-gradient(ellipse at top,#392348,#0e0d17 65%);color:#fff5ff;font:16px/1.5 system-ui,sans-serif}.wrap{max-width:800px;margin:auto}.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}.brand{font-size:13px;letter-spacing:.15em;color:#cdb7df}h1{font-size:clamp(34px,7vw,58px);margin:14px 0 4px}.sub{color:#cdb7df}.panel{margin-top:24px;padding:clamp(16px,4vw,28px);border:1px solid #553b68;border-radius:22px;background:#1c1528eF;box-shadow:0 20px 60px #0005}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,button{border:1px solid #604878;border-radius:12px;background:#30203e;color:#fff5ff;padding:10px 14px;cursor:pointer;font-weight:700}.tab.active,button.primary{background:#d6a6ff;color:#24132e;border-color:#d6a6ff}.mode{display:none;margin-top:20px}.mode.active{display:block}.fields{display:flex;gap:10px;flex-wrap:wrap}.fields label{flex:1;min-width:120px;color:#cdb7df;font-size:13px}.fields input,.fields textarea{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #553b68;border-radius:10px;background:#120e1a;color:white;font:inherit}.result{margin:18px 0;padding:24px;border-radius:18px;background:#100c18;border:1px solid #553b68;text-align:center}.result strong{display:block;font-size:clamp(36px,10vw,72px);line-height:1.15;overflow-wrap:anywhere}.result small{color:#cdb7df}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.history{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{background:#30203e;border-radius:9px;padding:6px 10px;font-size:13px}.hint{font-size:13px;color:#cdb7df;margin-top:12px}
</style></head><body><main class="wrap"><div class="top"><div class="brand">CLOSE APPS / RANDOM TOOLS</div><a href="../" style="color:#d6a6ff;text-decoration:none">← На главную</a></div><h1>Close Random</h1><p class="sub">Когда сложно выбрать — доверь решение случайности. Числа, варианты и быстрый бросок кубика в одном месте.</p><section class="panel"><div class="tabs"><button class="tab active" data-mode="number">🎲 Число</button><button class="tab" data-mode="choice">🤔 Выбор</button><button class="tab" data-mode="dice">🎯 Кубик</button></div><div class="mode active" id="number"><div class="fields"><label>От<input id="min" type="number" value="1"></label><label>До<input id="max" type="number" value="100"></label></div><div class="result"><strong id="numResult">42</strong><small>Случайное целое число</small></div><button class="primary" id="rollNumber">Сгенерировать число</button></div><div class="mode" id="choice"><label for="choices">Варианты — каждый с новой строки</label><textarea id="choices" rows="5" style="display:block;width:100%;margin-top:8px;padding:12px;background:#120e1a;color:white;border:1px solid #553b68;border-radius:10px;font:inherit">Пицца\nБургер\nСуши</textarea><div class="result"><strong id="choiceResult">?</strong><small>Выбранный вариант</small></div><button class="primary" id="pick">Выбрать за меня</button></div><div class="mode" id="dice"><div class="result"><strong id="diceResult">⚄</strong><small id="diceText">Результат броска</small></div><div class="row"><button class="primary" id="rollDice">Бросить кубик</button><button id="rollTwo">Бросить два кубика</button></div></div><div class="history" id="history"></div><div class="hint">История результатов хранится только пока открыта эта страница.</div></section></main><script>
const $=s=>document.querySelector(s),history=[];function record(v){history.unshift(String(v));history.splice(8);$('#history').innerHTML=history.map(x=>'<span class="chip">'+x.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</span>').join('')}function integer(a,b){a=Math.ceil(a);b=Math.floor(b);if(!Number.isFinite(a)||!Number.isFinite(b)||b<a){alert('Проверь диапазон: верхняя граница должна быть не меньше нижней.');return null}return Math.floor(Math.random()*(b-a+1))+a}document.querySelectorAll('.tab').forEach(btn=>btn.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===btn));document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.id===btn.dataset.mode))});$('#rollNumber').onclick=()=>{let n=integer(+$ ('#min').value,+$('#max').value);if(n!==null){$('#numResult').textContent=n;record('Число: '+n)}};$('#pick').onclick=()=>{let arr=$('#choices').value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(!arr.length){alert('Добавь хотя бы один вариант.');return}let v=arr[Math.floor(Math.random()*arr.length)];$('#choiceResult').textContent=v;record('Выбор: '+v)};function dice(n){let v=Array.from({length:n},()=>Math.floor(Math.random()*6)+1);$('#diceResult').textContent=v.map(x=>['','⚀','⚁','⚂','⚃','⚄','⚅'][x]).join('  ');$('#diceText').textContent='Сумма: '+v.reduce((a,b)=>a+b,0);record('Кубик: '+v.join('+')+' = '+v.reduce((a,b)=>a+b,0))}$('#rollDice').onclick=()=>dice(1);$('#rollTwo').onclick=()=>dice(2);$('#rollNumber').click();
</script></body></html>
