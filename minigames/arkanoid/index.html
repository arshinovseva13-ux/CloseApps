<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d1b"><title>Арканоид · CloseApps</title><style>
:root{color-scheme:dark;--bg:#080d1b;--panel:#111a2d;--line:#293751;--text:#f4f7ff;--muted:#9eabc3;--accent:#8b5cf6;--cyan:#22d3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#35205d 0,transparent 38%),radial-gradient(ellipse at 90% 100%,#103a4a 0,transparent 35%),var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}.wrap{max-width:850px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{color:#c4b5fd;text-decoration:none;font-weight:800}.back{color:#cbd5e1;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:9px 13px}.hero{text-align:center;margin:24px 0}.emoji{font-size:44px}.hero h1{font-size:clamp(28px,6vw,44px);margin:6px 0}.hero p{color:var(--muted);margin:0}.panel{background:#111a2ddd;border:1px solid var(--line);border-radius:22px;padding:clamp(16px,4vw,28px);box-shadow:0 22px 70px #0005}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stat{background:#0b1222;border:1px solid var(--line);border-radius:12px;padding:9px 16px;color:var(--muted)}.stat b{color:white;margin-left:6px}.btn,button{border:0;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:white;padding:11px 17px;font:inherit;font-weight:750;cursor:pointer}.btn:active,button:active{transform:scale(.97)}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}.muted{color:var(--muted);text-align:center;font-size:13px;margin-top:15px}canvas{display:block;max-width:100%;height:auto;margin:auto;border:1px solid var(--line);border-radius:12px;background:#080f1e;touch-action:none}.grid{display:grid;gap:8px;max-width:480px;margin:auto}.tile{background:#202d47;border:1px solid #40516f;border-radius:12px;min-height:54px;display:grid;place-items:center;font-size:24px;font-weight:800;cursor:pointer;user-select:none}.tile:disabled{cursor:default}.good{background:#166534!important}.bad{background:#991b1b!important}.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:440px;margin:15px auto}.keypad button{padding:12px 3px}.wide{grid-column:span 2}.game-area{text-align:center}.notice{min-height:26px;color:#c4b5fd;margin:12px 0;font-weight:700}@media(max-width:520px){body{padding:12px}.panel{padding:13px}.tile{min-height:46px}.top{margin-bottom:12px}}
</style></head><body><div class="wrap"><div class="top"><a class="brand" href="https://arshinovseva13-ux.github.io/CloseApps/">▦ Close Приложения</a><a class="back" href="https://arshinovseva13-ux.github.io/CloseApps/">← В хаб</a></div><header class="hero"><div class="emoji">🟣</div><h1>Арканоид</h1><p>Разбивай блоки мячом и не дай ему упасть.</p></header><main class="panel"><div class='stats'><div class='stat'>Очки<b id='score'>0</b></div><div class='stat'>Жизни<b id='life'>3</b></div></div><canvas id='c' width='480' height='420'></canvas><div class='controls'><button onpointerdown='dir=-1' onpointerup='dir=0'>←</button><button onpointerdown='dir=1' onpointerup='dir=0'>→</button><button onclick='reset()'>Заново</button></div><div class='notice' id='msg'>Управляй платформой стрелками или кнопками</div></main><p class="muted">CloseApps Mini Games · Игра работает прямо в браузере</p></div><script>const c=document.getElementById('c'),x=c.getContext('2d');let px=205,bx=240,by=330,vx=3,vy=-3,dir=0,bricks=[],score=0,life=3,run=true;function reset(){px=205;bx=240;by=330;vx=3;vy=-3;score=0;life=3;make();document.getElementById('msg').textContent='Разбей все блоки!';if(!run){run=true;loop()}}function make(){bricks=[];for(let r=0;r<4;r++)for(let k=0;k<8;k++)bricks.push({x:12+k*58,y:35+r*25,on:true});}function draw(){x.fillStyle='#080f1e';x.fillRect(0,0,480,420);bricks.forEach((b,i)=>{if(b.on){x.fillStyle=['#a78bfa','#22d3ee','#f472b6','#fbbf24'][i%4];x.fillRect(b.x,b.y,50,16)}});x.fillStyle='#fff';x.fillRect(px,385,70,10);x.beginPath();x.arc(bx,by,7,0,7);x.fill()}function loop(){if(!run)return;px=Math.max(0,Math.min(410,px+dir*5));bx+=vx;by+=vy;if(bx<7||bx>473)vx*=-1;if(by<7)vy*=-1;if(by>375&&by<400&&bx>px&&bx<px+70){vy=-Math.abs(vy);vx+=(bx-(px+35))*.035}for(let b of bricks)if(b.on&&bx>b.x&&bx<b.x+50&&by>b.y&&by<b.y+16){b.on=false;vy*=-1;score+=10;document.getElementById('score').textContent=score;break}if(by>425){life--;document.getElementById('life').textContent=life;if(life<=0){run=false;document.getElementById('msg').textContent='Игра окончена — нажми «Заново»'}else{bx=240;by=330;vy=-3}}if(bricks.every(b=>!b.on)){run=false;document.getElementById('msg').textContent='Победа! Все блоки разбиты 🎉'}draw();if(run)requestAnimationFrame(loop)}onkeydown=e=>{if(e.key==='ArrowLeft')dir=-1;if(e.key==='ArrowRight')dir=1};onkeyup=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key))dir=0};c.addEventListener('pointermove',e=>{let r=c.getBoundingClientRect();px=(e.clientX-r.left)*480/r.width-35});function start(){run=true;loop()}function reset(){run=false;px=205;bx=240;by=330;vx=3;vy=-3;score=0;life=3;document.getElementById('score').textContent=0;document.getElementById('life').textContent=3;make();draw();start()}make();draw();loop();</script></body></html>
