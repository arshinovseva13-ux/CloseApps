</style></head><body><div class="wrap"><div class="top"><a class="brand" href="https://arshinovseva13-ux.github.io/CloseApps/">▦ Close Приложения</a><a class="back" href="https://arshinovseva13-ux.github.io/CloseApps/">← В хаб</a></div><header class="hero"><div class="emoji">🔢</div><h1>Судоку</h1><p>Заполняй поле цифрами от 1 до 9 без повторов в строках, столбцах и квадратах.</p></header><main class="panel"><div class='stats'><div class='stat'>Заполнено<b id='filled'>0/81</b></div></div><div id='grid' class='grid' style='grid-template-columns:repeat(9,1fr);gap:2px;max-width:450px'></div><div class='keypad' id='keys' style='grid-template-columns:repeat(9,1fr)'></div><div class='notice' id='msg'>Выбери клетку, затем цифру</div><div class='controls'><button onclick='check()'>Проверить</button><button onclick='init()'>Сбросить</button></div></main><p class="muted">CloseApps Mini Games · Игра работает прямо в браузере</p></div><script>const puzzle='530070000600195000098000060800060003400803001700020006060000280000419005000080079';let sol='534678912672195348198342567859761423426853791713924856961537284287419635345286179',v,sel=-1;function init(){v=puzzle.split('').map(Number);sel=-1;draw()}function draw(){document.getElementById('filled').textContent=v.filter(Boolean).length+'/81';document.getElementById('grid').innerHTML=v.map((n,i)=>{let row=Math.floor(i/9),col=i%9,edge=(col===2||col===5?'border-right:3px solid #8b5cf6;':'')+(row===2||row===5?'border-bottom:3px solid #8b5cf6;':'');return `<button class="tile" style="min-height:39px;padding:0;border-radius:3px;font-size:18px;background:${i===sel?'#5b21b6':puzzle[i]!=='0'?'#293751':'#101a2d'};${edge}" onclick="select(${i})">${n||''}</button>`}).join('');document.getElementById('keys').innerHTML='123456789'.split('').map(n=>`<button onclick="put(${n})">${n}</button>`).join('')}function select(i){sel=i;draw()}function put(n){if(sel<0||puzzle[sel]!=='0')return;v[sel]=n;draw()}function check(){if(v.every((n,i)=>n===+sol[i]))document.getElementById('msg').textContent='Судоку решено! Отличная работа 🎉';else document.getElementById('msg').textContent='Пока есть ошибки или пустые клетки'}init();</script></body></html>
