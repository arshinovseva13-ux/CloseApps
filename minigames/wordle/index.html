<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d1b"><title>Слово за 6 попыток · CloseApps</title><style>
:root{color-scheme:dark;--bg:#080d1b;--panel:#111a2d;--line:#293751;--text:#f4f7ff;--muted:#9eabc3;--accent:#8b5cf6;--cyan:#22d3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#35205d 0,transparent 38%),radial-gradient(ellipse at 90% 100%,#103a4a 0,transparent 35%),var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}.wrap{max-width:850px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{color:#c4b5fd;text-decoration:none;font-weight:800}.back{color:#cbd5e1;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:9px 13px}.hero{text-align:center;margin:24px 0}.emoji{font-size:44px}.hero h1{font-size:clamp(28px,6vw,44px);margin:6px 0}.hero p{color:var(--muted);margin:0}.panel{background:#111a2ddd;border:1px solid var(--line);border-radius:22px;padding:clamp(16px,4vw,28px);box-shadow:0 22px 70px #0005}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stat{background:#0b1222;border:1px solid var(--line);border-radius:12px;padding:9px 16px;color:var(--muted)}.stat b{color:white;margin-left:6px}.btn,button{border:0;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:white;padding:11px 17px;font:inherit;font-weight:750;cursor:pointer}.btn:active,button:active{transform:scale(.97)}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}.muted{color:var(--muted);text-align:center;font-size:13px;margin-top:15px}canvas{display:block;max-width:100%;height:auto;margin:auto;border:1px solid var(--line);border-radius:12px;background:#080f1e;touch-action:none}.grid{display:grid;gap:8px;max-width:480px;margin:auto}.tile{background:#202d47;border:1px solid #40516f;border-radius:12px;min-height:54px;display:grid;place-items:center;font-size:24px;font-weight:800;cursor:pointer;user-select:none}.tile:disabled{cursor:default}.good{background:#166534!important}.bad{background:#991b1b!important}.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:440px;margin:15px auto}.keypad button{padding:12px 3px}.wide{grid-column:span 2}.game-area{text-align:center}.notice{min-height:26px;color:#c4b5fd;margin:12px 0;font-weight:700}@media(max-width:520px){body{padding:12px}.panel{padding:13px}.tile{min-height:46px}.top{margin-bottom:12px}}
</style></head><body><div class="wrap"><div class="top"><a class="brand" href="https://arshinovseva13-ux.github.io/CloseApps/">▦ Close Приложения</a><a class="back" href="https://arshinovseva13-ux.github.io/CloseApps/">← В хаб</a></div><header class="hero"><div class="emoji">🔤</div><h1>Слово за 6 попыток</h1><p>Угадай секретное слово из пяти букв.</p></header><main class="panel"><div class='stats'><div class='stat'>Попытка<b id='attempt'>1/6</b></div></div><div id='grid' class='grid' style='grid-template-columns:repeat(5,1fr);max-width:340px'></div><div class='notice' id='msg'>Введи слово из 5 букв</div><div class='keypad' id='keys'></div><div class='controls'><button onclick='submitWord()'>Проверить</button><button onclick='init()'>Новое слово</button></div></main><p class="muted">CloseApps Mini Games · Игра работает прямо в браузере</p></div><script>const words=['АРБУЗ','БЕРЕГ','ВЕТЕР','ГОРОД','ДОСКА','ЖИВОТ','ЗАКАТ','ИГРОК','КНИГА','КОМАР','ЛАМПА','МЕТРО','МОРЕ','МЫШКА','ОКЕАН','ПАРТА','ПТИЦА','РАДУГА','САЛЮТ','СЕВЕР','СИРЕНЬ','СЛОВО','СОСНА','ТЕАТР','УДАЧА','ФАКЕЛ','ХВОСТ','ЦИФРА','ШАРЫ','ЯГОДА'];let answer,guess,rows,ended;function init(){answer=words[Math.random()*words.length|0];guess='';rows=0;ended=false;draw();document.getElementById('msg').textContent='Введи слово из 5 букв'}function draw(){document.getElementById('attempt').textContent=Math.min(rows+1,6)+'/6';document.getElementById('grid').innerHTML=Array.from({length:30},(_,i)=>`<div class="tile" id="w${i}" style="min-height:48px">${i>=rows*5&&i<rows*5+guess.length?guess[i%5]:''}</div>`).join('');document.getElementById('keys').innerHTML='АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЫЭЮЯ'.split('').map(k=>`<button onclick="typeKey('${k}')">${k}</button>`).join('')+'<button class="wide" onclick="typeKey(\'⌫\')">⌫</button>'}function typeKey(k){if(ended)return;if(k==='⌫')guess=guess.slice(0,-1);else if(guess.length<5)guess+=k;draw()}function submitWord(){if(guess.length!==5){document.getElementById('msg').textContent='Нужно ровно 5 букв';return}let chars=answer.split(''),res=Array(5).fill('bad');guess.split('').forEach((v,i)=>{if(v===chars[i]){res[i]='good';chars[i]=null}});guess.split('').forEach((v,i)=>{if(res[i]!=='good'){let p=chars.indexOf(v);if(p>=0){res[i]='';chars[p]=null}}});for(let i=0;i<5;i++)document.getElementById('w'+(rows*5+i)).className='tile '+(res[i]||'');rows++;if(guess===answer){ended=true;document.getElementById('msg').textContent='Верно! Ты угадал 🎉'}else if(rows===6){ended=true;document.getElementById('msg').textContent='Ответ: '+answer}else{guess='';draw()}}onkeydown=e=>{if(/^[а-яё]$/i.test(e.key))typeKey(e.key.toUpperCase());if(e.key==='Backspace')typeKey('⌫');if(e.key==='Enter')submitWord()};init();</script></body></html>
