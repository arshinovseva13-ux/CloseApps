<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080d1b"><title>Змейка · CloseApps</title><style>
:root{color-scheme:dark;--bg:#080d1b;--panel:#111a2d;--line:#293751;--text:#f4f7ff;--muted:#9eabc3;--accent:#8b5cf6;--cyan:#22d3ee}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#35205d 0,transparent 38%),radial-gradient(ellipse at 90% 100%,#103a4a 0,transparent 35%),var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}.wrap{max-width:850px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{color:#c4b5fd;text-decoration:none;font-weight:800}.back{color:#cbd5e1;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:9px 13px}.hero{text-align:center;margin:24px 0}.emoji{font-size:44px}.hero h1{font-size:clamp(28px,6vw,44px);margin:6px 0}.hero p{color:var(--muted);margin:0}.panel{background:#111a2ddd;border:1px solid var(--line);border-radius:22px;padding:clamp(16px,4vw,28px);box-shadow:0 22px 70px #0005}.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.stat{background:#0b1222;border:1px solid var(--line);border-radius:12px;padding:9px 16px;color:var(--muted)}.stat b{color:white;margin-left:6px}.btn,button{border:0;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:white;padding:11px 17px;font:inherit;font-weight:750;cursor:pointer}.btn:active,button:active{transform:scale(.97)}.controls{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}.muted{color:var(--muted);text-align:center;font-size:13px;margin-top:15px}canvas{display:block;max-width:100%;height:auto;margin:auto;border:1px solid var(--line);border-radius:12px;background:#080f1e;touch-action:none}.grid{display:grid;gap:8px;max-width:480px;margin:auto}.tile{background:#202d47;border:1px solid #40516f;border-radius:12px;min-height:54px;display:grid;place-items:center;font-size:24px;font-weight:800;cursor:pointer;user-select:none}.tile:disabled{cursor:default}.good{background:#166534!important}.bad{background:#991b1b!important}.keypad{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-width:440px;margin:15px auto}.keypad button{padding:12px 3px}.wide{grid-column:span 2}.game-area{text-align:center}.notice{min-height:26px;color:#c4b5fd;margin:12px 0;font-weight:700}@media(max-width:520px){body{padding:12px}.panel{padding:13px}.tile{min-height:46px}.top{margin-bottom:12px}}
</style></head><body><div class="wrap"><div class="top"><a class="brand" href="https://arshinovseva13-ux.github.io/CloseApps/">▦ Close Приложения</a><a class="back" href="https://arshinovseva13-ux.github.io/CloseApps/">← В хаб</a></div><header class="hero"><div class="emoji">🐍</div><h1>Змейка</h1><p>Собирай яблоки, расти и не врезайся в себя.</p></header><main class="panel"><div class='stats'><div class='stat'>Очки<b id='score'>0</b></div><div class='stat'>Рекорд<b id='best'>0</b></div></div><canvas id='c' width='400' height='400'></canvas><div class='controls'><button onclick='move(0,-1)'>↑</button><button onclick='move(-1,0)'>←</button><button onclick='move(0,1)'>↓</button><button onclick='move(1,0)'>→</button><button onclick='start()'>Заново</button></div><div class='notice' id='msg'>Нажми стрелку, чтобы начать</div></main><p class="muted">CloseApps Mini Games · Игра работает прямо в браузере</p></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),N=20,S=20;let snake,dir,food,score,timer,dead=true;let best=+(localStorage.snakeBest||0);bestEl();function bestEl(){document.getElementById('best').textContent=best}function start(){clearInterval(timer);snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};food={x:14,y:10};score=0;dead=false;draw();document.getElementById('msg').textContent='Поехали!';timer=setInterval(step,115);upd()}function upd(){document.getElementById('score').textContent=score;bestEl()}function move(a,b){if(dead){start();return}if(a!==-dir.x||b!==-dir.y)dir={x:a,y:b}}function step(){let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(p=>p.x===h.x&&p.y===h.y)){dead=true;clearInterval(timer);document.getElementById('msg').textContent='Игра окончена — нажми «Заново»';return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;do{food={x:Math.random()*N|0,y:Math.random()*N|0}}while(snake.some(p=>p.x===food.x&&p.y===food.y));if(score>best){best=score;localStorage.snakeBest=best}}else snake.pop();upd();draw()}function draw(){x.fillStyle='#080f1e';x.fillRect(0,0,400,400);x.fillStyle='#f472b6';x.fillRect(food.x*S+3,food.y*S+3,14,14);snake.forEach((p,i)=>{x.fillStyle=i?'#22d3ee':'#a78bfa';x.fillRect(p.x*S+1,p.y*S+1,18,18)})}onkeydown=e=>{let m={ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1],ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0]};if(m[e.key]){e.preventDefault();move(...m[e.key])}};start();</script></body></html>
