<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fifteen — CloseApps</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:#101827;color:#eff6ff;font:16px system-ui}.app{width:min(100%,440px)}header,.stats,.actions{display:flex;justify-content:space-between;align-items:center;gap:8px}a{color:#83e6d6}h1{font-size:42px;margin:22px 0}.stat{background:#1d2a3d;padding:7px 12px;border-radius:9px;text-align:center}.stat small{display:block;color:#9aacc2;font-size:10px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:9px;background:#1e2c40;border-radius:14px}.tile{aspect-ratio:1;border:0;border-radius:9px;background:#31506c;color:white;font-size:clamp(23px,7vw,36px);font-weight:900}.empty{background:#111c2b}.btn{border:0;border-radius:9px;padding:11px 14px;background:#287e79;color:white;font-weight:bold;margin-top:13px}.hint{color:#9aacc2;line-height:1.5}.win{color:#7df0c2}</style><main class="app"><header><b>CLOSEAPPS / MINI GAMES</b><a href="../">← Каталог</a></header><div class="stats"><h1>Fifteen</h1><div class="stat"><small>ХОДЫ</small><b id="moves">0</b></div></div><div class="board" id="board"></div><div id="win" class="win"></div><div class="actions"><button class="btn" id="undo">↶ Отменить</button><button class="btn" id="new">Новая игра</button></div><p class="hint">Расставь плитки от 1 до 15 по порядку. Передвигай плитки в пустую клетку. Новая раскладка всегда решаемая.</p></main><script>let a=[],moves=0,h=[];const el=id=>document.getElementById(id);function solved(){return a.every((v,i)=>v===(i===15?0:i+1))}function draw(){el('board').innerHTML=a.map((v,i)=>'<button class="tile '+(!v?'empty':'')+'" data-i="'+i+'" '+(!v?'disabled':'')+'>'+(v||'')+'</button>').join('');el('moves').textContent=moves;el('win').textContent=solved()?'🎉 Готово! Ты решил головоломку!':''}function swap(i){let z=a.indexOf(0);if(Math.abs(i%4-z%4)+Math.abs((i/4|0)-(z/4|0))!==1)return;h.push(a.slice());[a[i],a[z]]=[a[z],a[i]];moves++;draw()}function fresh(){a=Array.from({length:15},(_,i)=>i+1).concat(0);let prev=-1;for(let n=0;n<250;n++){let z=a.indexOf(0),opts=[z%4?z-1:-1,z%4<3?z+1:-1,z>3?z-4:-1,z<12?z+4:-1].filter(x=>x>=0&&x!==prev),p=opts[Math.random()*opts.length|0];[a[z],a[p]]=[a[p],a[z]];prev=z}moves=0;h=[];draw()}el('board').onclick=e=>{let b=e.target.closest('[data-i]');if(b)swap(+b.dataset.i)};el('new').onclick=fresh;el('undo').onclick=()=>{if(h.length){a=h.pop();moves--;draw()}};fresh();</script></main></html>
