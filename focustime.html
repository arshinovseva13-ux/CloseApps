<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101525"><title>FocusTime</title><style>
:root{color-scheme:dark;--line:#343e59;--text:#f4f6ff;--muted:#aab4cc;--accent:#72e5bb;--ok:#72e5bb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#34305c 0,transparent 40%),#101525;color:var(--text);font:15px/1.5 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#222a42;color:var(--text);padding:10px 13px;border-radius:12px;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#17152a;font-weight:800}input,textarea,select{background:#111729;color:var(--text);border:1px solid var(--line);padding:11px;border-radius:11px;width:100%;min-width:0}header{max-width:1100px;margin:auto;padding:22px clamp(14px,3vw,30px);display:flex;align-items:center;gap:13px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#69e2c1);font-size:24px;color:#17152a;font-weight:900}h1{font-size:clamp(24px,4vw,34px);margin:0}header p{margin:5px 0 0;color:var(--muted)}.back{margin-left:auto;color:var(--muted);text-decoration:none;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:0 clamp(12px,3vw,30px) 40px}.hero,.panel{border:1px solid var(--line);border-radius:18px;background:#191f33ef;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(120deg,#2b2b50,#191f33 70%)}.hero p{color:var(--muted);margin:5px 0 0}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:14px}.panel h2{font-size:17px;margin:0 0 13px}.field{display:grid;gap:6px;margin:10px 0}.field label,.muted,.small{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:12px;padding:11px;background:#111729;overflow-wrap:anywhere}.status{min-height:20px;color:var(--ok);font-size:13px;margin-top:8px}.big{font-size:clamp(38px,8vw,68px);font-weight:900;letter-spacing:-.05em;line-height:1.15}.empty{color:var(--muted);text-align:center;padding:22px}@media(max-width:760px){.layout{grid-template-columns:1fr}.back{font-size:12px}.panel,.hero{padding:14px}}@media(max-width:440px){header{gap:9px}.logo{width:42px;height:42px}}
</style></head><body><header><div class="logo">◷</div><div><h1>FocusTime</h1><p>Фокус, учёба и перерывы</p></div><a class="back" href="index.html">← Каталог</a></header><main class="wrap"><section class="hero"><strong>FocusTime — полезный инструмент на каждый день</strong><p>Работает прямо в браузере и адаптирован для телефона и компьютера. Данные сохраняются на устройстве.</p></section><div class="layout"><section class="panel" style="text-align:center"><span id="mode">Фокус</span><div class="big" id="clock" style="margin:24px 0">25:00</div><div class="row"><button class="primary" id="start">▶ Старт</button><button id="reset">↺ Сбросить</button><button id="skip">Следующий этап →</button></div><p class="status" id="status">Готов к началу</p></section><aside class="panel"><h2>⚙️ Настройки</h2><div class="field"><label for="focus">Фокус, минут</label><input id="focus" type="number" min="1" max="180" value="25"></div><div class="field"><label for="rest">Перерыв, минут</label><input id="rest" type="number" min="1" max="60" value="5"></div><button id="apply">Применить</button><h2 style="margin-top:22px">📈 Сегодня</h2><p>Фокус-сессий: <strong id="sessions">0</strong></p><p>Минут фокуса: <strong id="minutes">0</strong></p></aside></div></main><script>(()=>{const $=x=>document.getElementById(x),key='focustimeStatsV1';let f=25,r=5,m='focus',left=1500,running=false,ends=0,timer=null,st={sessions:0,minutes:0};try{st={...st,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{}function render(){$('clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('mode').textContent=m==='focus'?'Фокус':'Перерыв';$('start').textContent=running?'Ⅱ Пауза':'▶ Старт';$('sessions').textContent=st.sessions;$('minutes').textContent=st.minutes;document.title=$('clock').textContent+' · FocusTime'}function stop(){running=false;clearInterval(timer);timer=null;render()}function start(){if(running){stop();return}running=true;ends=Date.now()+left*1000;timer=setInterval(()=>{left=Math.max(0,Math.ceil((ends-Date.now())/1000));if(!left){if(m==='focus'){st.sessions++;st.minutes+=f;localStorage.setItem(key,JSON.stringify(st))}m=m==='focus'?'rest':'focus';left=(m==='focus'?f:r)*60;ends=Date.now()+left*1000;$('status').textContent=m==='rest'?'Фокус окончен — пора отдохнуть!':'Перерыв окончен — продолжаем!';try{let C=window.AudioContext||window.webkitAudioContext;if(C){let c=new C(),o=c.createOscillator();o.connect(c.destination);o.start();o.stop(c.currentTime+.2)}}catch{}}render()},250);render()}$('start').onclick=start;$('reset').onclick=()=>{stop();left=(m==='focus'?f:r)*60;render()};$('skip').onclick=()=>{stop();m=m==='focus'?'rest':'focus';left=(m==='focus'?f:r)*60;render()};$('apply').onclick=()=>{let a=+$('focus').value,b=+$('rest').value;if(!Number.isInteger(a)||a<1||a>180||!Number.isInteger(b)||b<1||b>60){$('status').textContent='Фокус: 1–180, перерыв: 1–60 минут.';return}f=a;r=b;stop();m='focus';left=f*60;$('status').textContent='Интервалы обновлены';render()};render()})();</script></body></html>
