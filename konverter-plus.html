<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101525"><title>Конвертер+</title><style>
:root{color-scheme:dark;--line:#343e59;--text:#f4f6ff;--muted:#aab4cc;--accent:#66c8ff;--ok:#72e5bb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#34305c 0,transparent 40%),#101525;color:var(--text);font:15px/1.5 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#222a42;color:var(--text);padding:10px 13px;border-radius:12px;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#17152a;font-weight:800}input,textarea,select{background:#111729;color:var(--text);border:1px solid var(--line);padding:11px;border-radius:11px;width:100%;min-width:0}header{max-width:1100px;margin:auto;padding:22px clamp(14px,3vw,30px);display:flex;align-items:center;gap:13px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#69e2c1);font-size:24px;color:#17152a;font-weight:900}h1{font-size:clamp(24px,4vw,34px);margin:0}header p{margin:5px 0 0;color:var(--muted)}.back{margin-left:auto;color:var(--muted);text-decoration:none;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:0 clamp(12px,3vw,30px) 40px}.hero,.panel{border:1px solid var(--line);border-radius:18px;background:#191f33ef;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(120deg,#2b2b50,#191f33 70%)}.hero p{color:var(--muted);margin:5px 0 0}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:14px}.panel h2{font-size:17px;margin:0 0 13px}.field{display:grid;gap:6px;margin:10px 0}.field label,.muted,.small{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:12px;padding:11px;background:#111729;overflow-wrap:anywhere}.status{min-height:20px;color:var(--ok);font-size:13px;margin-top:8px}.big{font-size:clamp(38px,8vw,68px);font-weight:900;letter-spacing:-.05em;line-height:1.15}.empty{color:var(--muted);text-align:center;padding:22px}@media(max-width:760px){.layout{grid-template-columns:1fr}.back{font-size:12px}.panel,.hero{padding:14px}}@media(max-width:440px){header{gap:9px}.logo{width:42px;height:42px}}
</style></head><body><header><div class="logo">⇄</div><div><h1>Конвертер+</h1><p>Единицы измерения — быстро и понятно</p></div><a class="back" href="index.html">← Каталог</a></header><main class="wrap"><section class="hero"><strong>Конвертер+ — полезный инструмент на каждый день</strong><p>Работает прямо в браузере и адаптирован для телефона и компьютера. Данные сохраняются на устройстве.</p></section><section class="panel"><h2>🔁 Конвертация единиц</h2><div class="field"><label for="cat">Категория</label><select id="cat"><option value="length">Длина</option><option value="mass">Масса</option><option value="area">Площадь</option><option value="volume">Объём</option><option value="speed">Скорость</option><option value="temp">Температура</option></select></div><div class="layout"><div><div class="field"><label for="value">Значение</label><input id="value" type="number" step="any" value="1"></div><div class="field"><label for="from">Из единиц</label><select id="from"></select></div></div><div><div class="field"><label>Результат</label><div class="big" id="result" style="font-size:clamp(28px,5vw,44px)">100</div></div><div class="field"><label for="to">В единицы</label><select id="to"></select></div></div></div><div class="row"><button class="primary" id="swap">⇄ Поменять местами</button><button id="clear">Очистить</button></div><p class="status" id="status"></p></section></main><script>(()=>{const $=x=>document.getElementById(x),D={length:{m:1,km:1000,cm:.01,mm:.001,mi:1609.344,ft:.3048,in:.0254},mass:{kg:1,g:.001,mg:.000001,t:1000,lb:.45359237,oz:.028349523125},area:{'м²':1,'км²':1e6,'см²':.0001,'га':10000,'акр':4046.8564224},volume:{'л':1,'мл':.001,'м³':1000,'см³':.001,'галлон США':3.785411784},speed:{'м/с':1,'км/ч':1/3.6,'миль/ч':.44704,'узел':.5144444444},temp:{'°C':0,'°F':1,K:2}},N={length:{m:'метр',km:'километр',cm:'сантиметр',mm:'миллиметр',mi:'миля',ft:'фут',in:'дюйм'},mass:{kg:'килограмм',g:'грамм',mg:'миллиграмм',t:'тонна',lb:'фунт',oz:'унция'},area:{'м²':'м²','км²':'км²','см²':'см²','га':'гектар','акр':'акр'},volume:{'л':'литр','мл':'миллилитр','м³':'м³','см³':'см³','галлон США':'галлон США'},speed:{'м/с':'м/с','км/ч':'км/ч','миль/ч':'миль/ч','узел':'узел'},temp:{'°C':'Цельсий','°F':'Фаренгейт',K:'Кельвин'}};function cv(v,c,a,b){if(c!=='temp')return v*D[c][a]/D[c][b];let k=a==='°C'?v+273.15:a==='°F'?(v-32)*5/9+273.15:v;if(k<0)throw Error('Ниже абсолютного нуля.');return b==='°C'?k-273.15:b==='°F'?(k-273.15)*9/5+32:k}function calc(){try{if($('value').value.trim()==='')throw Error('Введи число.');let n=cv(Number($('value').value),$('cat').value,$('from').value,$('to').value);if(!Number.isFinite(n))throw Error('Проверь значение.');$('result').textContent=new Intl.NumberFormat('ru-RU',{maximumSignificantDigits:10}).format(n);$('status').textContent='Готово ✓'}catch(e){$('result').textContent='—';$('status').textContent=e.message}}function fill(){let c=$('cat').value,ks=Object.keys(D[c]);for(let id of ['from','to'])$(id).innerHTML=ks.map(k=>'<option value="'+k+'">'+(N[c][k]||k)+' ('+k+')</option>').join('');if(c==='length'){$('from').value='m';$('to').value='cm'}else if(c==='temp'){$('from').value='°C';$('to').value='°F'}else{$('from').selectedIndex=0;$('to').selectedIndex=1}calc()}$('cat').onchange=fill;$('value').oninput=calc;$('from').onchange=calc;$('to').onchange=calc;$('swap').onclick=()=>{let a=$('from').value;$('from').value=$('to').value;$('to').value=a;calc()};$('clear').onclick=()=>{$('value').value='';calc()};fill()})();</script></body></html>
