<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101525"><title>NoteFlow</title><style>
:root{color-scheme:dark;--line:#343e59;--text:#f4f6ff;--muted:#aab4cc;--accent:#b9a3ff;--ok:#72e5bb}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0%,#34305c 0,transparent 40%),#101525;color:var(--text);font:15px/1.5 system-ui,sans-serif}button,input,textarea,select{font:inherit}button{border:1px solid var(--line);background:#222a42;color:var(--text);padding:10px 13px;border-radius:12px;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#17152a;font-weight:800}input,textarea,select{background:#111729;color:var(--text);border:1px solid var(--line);padding:11px;border-radius:11px;width:100%;min-width:0}header{max-width:1100px;margin:auto;padding:22px clamp(14px,3vw,30px);display:flex;align-items:center;gap:13px}.logo{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#69e2c1);font-size:24px;color:#17152a;font-weight:900}h1{font-size:clamp(24px,4vw,34px);margin:0}header p{margin:5px 0 0;color:var(--muted)}.back{margin-left:auto;color:var(--muted);text-decoration:none;font-size:13px}.wrap{max-width:1100px;margin:auto;padding:0 clamp(12px,3vw,30px) 40px}.hero,.panel{border:1px solid var(--line);border-radius:18px;background:#191f33ef;padding:18px;margin-bottom:14px}.hero{background:linear-gradient(120deg,#2b2b50,#191f33 70%)}.hero p{color:var(--muted);margin:5px 0 0}.layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);gap:14px}.panel h2{font-size:17px;margin:0 0 13px}.field{display:grid;gap:6px;margin:10px 0}.field label,.muted,.small{color:var(--muted);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:12px;padding:11px;background:#111729;overflow-wrap:anywhere}.status{min-height:20px;color:var(--ok);font-size:13px;margin-top:8px}.big{font-size:clamp(38px,8vw,68px);font-weight:900;letter-spacing:-.05em;line-height:1.15}.empty{color:var(--muted);text-align:center;padding:22px}@media(max-width:760px){.layout{grid-template-columns:1fr}.back{font-size:12px}.panel,.hero{padding:14px}}@media(max-width:440px){header{gap:9px}.logo{width:42px;height:42px}}
</style></head><body><header><div class="logo">✍️</div><div><h1>NoteFlow</h1><p>Заметки, идеи и списки дел</p></div><a class="back" href="index.html">← Каталог</a></header><main class="wrap"><section class="hero"><strong>NoteFlow — полезный инструмент на каждый день</strong><p>Работает прямо в браузере и адаптирован для телефона и компьютера. Данные сохраняются на устройстве.</p></section><div class="layout"><section class="panel"><h2 id="heading">Новая заметка</h2><div class="field"><label for="title">Заголовок</label><input id="title" maxlength="120" placeholder="Планы на неделю"></div><div class="field"><label for="body">Текст / список дел</label><textarea id="body" maxlength="10000" placeholder="Запиши всё важное…"></textarea></div><div class="row"><button class="primary" id="save">Сохранить</button><button id="cancel" hidden>Отмена</button></div><p class="status" id="status"></p></section><section class="panel"><h2>📚 Мои заметки <span id="count">0</span></h2><input id="search" placeholder="Поиск по заметкам…"><div class="list" id="list" style="margin-top:10px"></div></section></div></main><script>(()=>{const $=x=>document.getElementById(x),key='noteflowNotesV1';let ns=[],edit=null;try{ns=JSON.parse(localStorage.getItem(key)||'[]')}catch{}const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function render(){let q=$('search').value.toLowerCase(),a=ns.filter(n=>(n.title+' '+n.body).toLowerCase().includes(q));$('count').textContent=ns.length;$('list').innerHTML=a.map(n=>'<article class="item"><div class="row"><strong style="flex:1">'+esc(n.title||'Без заголовка')+'</strong><button data-edit="'+n.id+'">✏️</button><button data-del="'+n.id+'">🗑️</button></div><p style="white-space:pre-wrap">'+esc(n.body)+'</p><span class="small">'+new Date(n.time).toLocaleString('ru-RU')+'</span></article>').join('')||'<div class="empty">Заметок нет. Создай первую!</div>'}function reset(){$('title').value='';$('body').value='';edit=null;$('heading').textContent='Новая заметка';$('save').textContent='Сохранить';$('cancel').hidden=true}$('save').onclick=()=>{let title=$('title').value.trim(),body=$('body').value.trim();if(!title&&!body){$('status').textContent='Введи заголовок или текст.';return}if(edit){let n=ns.find(n=>n.id===edit);if(n)Object.assign(n,{title,body,time:Date.now()})}else ns.unshift({id:String(Date.now())+Math.random(),title,body,time:Date.now()});localStorage.setItem(key,JSON.stringify(ns));reset();render();$('status').textContent='Сохранено ✓'};$('cancel').onclick=reset;$('search').oninput=render;$('list').onclick=e=>{let a=e.target.closest('[data-edit]'),b=e.target.closest('[data-del]');if(a){let n=ns.find(n=>n.id===a.dataset.edit);edit=n.id;$('title').value=n.title;$('body').value=n.body;$('heading').textContent='Редактирование';$('save').textContent='Сохранить изменения';$('cancel').hidden=false}if(b&&confirm('Удалить заметку?')){ns=ns.filter(n=>n.id!==b.dataset.del);localStorage.setItem(key,JSON.stringify(ns));render()}};render()})();</script></body></html>
