 if(id==='files')return '<h2>Файлы и быстрые ссылки</h2><p class="muted">В первой версии это виртуальная панель. Ваши настоящие файлы на устройстве не сканируются.</p><div class="panel"><div class="file-row"><span>📝</span><span class="file-name">Мои заметки</span><button class="action" data-action="open" data-app="notes">Открыть</button></div><div class="file-row"><span>📚</span><span class="file-name">Каталог CloseApps</span><button class="action" data-action="open" data-app="apps">Открыть</button></div><div class="file-row"><span>🎼</span><span class="file-name">SONORA — музыкальная лаборатория</span><button class="action" data-action="open" data-app="music">Запустить</button></div><div class="file-row"><span>🧩</span><span class="file-name">CLOSE // QUEST</span><button class="action" data-action="open" data-app="quest">Запустить</button></div></div><p class="muted small">Следующий этап: виртуальные папки, создание файлов, импорт и экспорт.</p>';
 if(id==='apps')return '<h2>Приложения CloseApps</h2><p class="muted">Все 19 проектов собраны в одном каталоге. Нажмите «Запустить», чтобы попробовать открыть проект в системном окне. Если сайт запрещает встраивание, нажмите «Открыть отдельно» внутри окна.</p><div class="grid2">'+apps.filter(a=>a.url).map(a=>'<div class="panel"><div style="font-size:27px">'+a.icon+'</div><b>'+safe(a.name)+'</b><p class="muted small">'+safe(a.desc)+'</p><button class="action" data-action="open" data-app="'+a.id+'">Запустить ↗</button></div>').join('')+'<div class="panel"><div style="font-size:27px">🌐</div><b>Главная CloseApps</b><p class="muted small">Весь каталог сайта.</p><button class="action" data-action="external" data-url="https://arshinovseva13-ux.github.io/CloseApps/">Открыть ↗</button></div></div>';
 if(id==='settings')return '<h2>Настройки</h2><p class="muted">Настройки сохраняются в этом браузере.</p><div class="panel"><b>Внешний вид</b><p class="muted small">Цветовая атмосфера рабочего стола</p><div class="grid2"><button class="action" data-action="theme" data-theme="neon">🌌 Неоновая ночь</button><button class="action" data-action="theme" data-theme="ocean">🌊 Океан</button><button class="action" data-action="theme" data-theme="violet">🔮 Фиолетовая дымка</button><button class="action" data-action="theme" data-theme="reset">↺ Сбросить тему</button></div></div><div class="panel" style="margin-top:12px"><b>Состояние системы</b><p class="muted small">Версия: 0.1.0 · Этап 1 · Юбилейное приложение №20</p><p class="muted small">Окна: свободное перемещение мышью или касанием. Данные: локальное хранилище браузера.</p><button class="action" data-action="export">Экспорт настроек и заметок</button><label class="action" style="display:inline-block;margin-left:5px">Импорт JSON<input id="importFile" type="file" accept="application/json,.json" hidden></label></div>';
 if(id==='calculator')return '<h2>Калькулятор</h2><input class="field" id="calcDisplay" value="" placeholder="Например: (12 + 8) * 3" inputmode="decimal"><div class="grid2" style="margin-top:10px"><button class="action" data-action="calculate">Вычислить =</button><button class="action" data-action="clearCalc">Очистить</button></div><p id="calcResult" class="muted">Поддерживаются числа, скобки и арифметические операторы.</p>';
 if(id==='browser')return '<h2>Веб-переход</h2><p class="muted">Введите адрес сайта, чтобы открыть его в отдельной вкладке.</p><input class="field" id="webAddress" placeholder="https://example.com"><button class="action" data-action="goUrl" style="margin-top:10px">Открыть сайт ↗</button>';
 if(id==='terminal')return '<div class="terminal" id="terminal"><div class="term-out">CLOSE Shell [version 0.1.0]\nЮбилейная веб-система №20. Введите help для списка команд.\n</div><div class="term-row"><b>close&gt;</b><input class="term-input" id="termInput" autocomplete="off" spellcheck="false" aria-label="Команда терминала"></div></div>';
 return '<h2>'+safe(appBy(id)?.name||'Приложение')+'</h2><p class="muted">Модуль готовится к подключению.</p>';
}
function createWindow(a,html){
 const el=document.createElement('section');el.className='window active';el.dataset.app=a.id;el.style.left=Math.max(12,Math.round((innerWidth-Math.min(720,innerWidth-30))/2+(winCount%5)*18))+'px';el.style.top=Math.max(60,Math.round((innerHeight-Math.min(480,innerHeight-130))/2+(winCount%5)*15))+'px';el.style.zIndex=++z;winCount++;
 el.innerHTML='<div class="window-header"><div class="traffic"><button data-action="minimize" aria-label="Свернуть"></button><button data-action="maximize" aria-label="Развернуть" style="background:#ffcf70"></button><button data-action="close" aria-label="Закрыть" style="background:#64e9a7"></button></div><div class="window-title">'+a.icon+' &nbsp;'+safe(a.name)+'</div><button class="action" data-action="maximize" style="padding:3px 8px">□</button></div><div class="window-body">'+html+'</div>';
 $('#windows').append(el);if(!a.url)openWindows.set(a.id,el);makeDraggable(el);focusWindow(el);bindContent(el);renderDock();return el;
}
function focusWindow(el){$$('.window').forEach(w=>w.classList.toggle('active',w===el));el.style.zIndex=++z}
function makeDraggable(el){const bar=el.querySelector('.window-header');let sx=0,sy=0,l=0,t=0,drag=false;bar.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(el.classList.contains('maximized'))return;drag=true;focusWindow(el);sx=e.clientX;sy=e.clientY;l=el.offsetLeft;t=el.offsetTop;bar.setPointerCapture(e.pointerId)});bar.addEventListener('pointermove',e=>{if(!drag)return;el.style.left=Math.max(0,Math.min(innerWidth-el.offsetWidth,l+e.clientX-sx))+'px';el.style.top=Math.max(48,Math.min(innerHeight-90,t+e.clientY-sy))+'px'});bar.addEventListener('pointerup',()=>drag=false);bar.addEventListener('pointercancel',()=>drag=false);el.addEventListener('pointerdown',()=>focusWindow(el))}
function closeWindow(el){openWindows.delete(el.dataset.app);el.remove();renderDock()}
function renderDock(){$$('.dock-btn[data-app]').forEach(b=>b.classList.toggle('running',!!openWindows.get(b.dataset.app)))}
function bindContent(el){
 el.addEventListener('input',e=>{if(e.target.id==='notesField'){state.notes=e.target.value;persist();const st=el.querySelector('#notesStatus');if(st)st.textContent='Сохранено · '+new Date().toLocaleTimeString() }});
 el.addEventListener('change',e=>{if(e.target.id==='importFile'){const f=e.target.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(typeof data.notes==='string')state.notes=data.notes;if(['neon','ocean','violet'].includes(data.theme))state.theme=data.theme;persist();applyTheme();toast('Настройки импортированы. Перезапустите окно заметок, чтобы увидеть текст.')}catch(err){toast('Не удалось прочитать JSON-файл')}};reader.readAsText(f)}});
 el.addEventListener('keydown',e=>{if(e.target.id==='termInput'&&e.key==='Enter'){const input=e.target;const cmd=input.value.trim();input.value='';runCommand(el,cmd)}if(e.target.id==='webAddress'&&e.key==='Enter')goUrl(e.target.value)});
 el.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const act=b.dataset.action;
 if(act==='close')closeWindow(el);
 if(act==='minimize'){el.style.display='none';renderDock()}
 if(act==='maximize')el.classList.toggle('maximized');
 if(act==='open')openApp(b.dataset.app);
 if(act==='external')window.open(b.dataset.url,'_blank','noopener,noreferrer');
 if(act==='theme'){state.theme=b.dataset.theme==='reset'?'neon':b.dataset.theme;persist();applyTheme();toast('Тема изменена')}
 if(act==='export')exportData();
 if(act==='calculate')calculate(el);
 if(act==='clearCalc'){el.querySelector('#calcDisplay').value='';el.querySelector('#calcResult').textContent=''}
 if(act==='goUrl')goUrl(el.querySelector('#webAddress').value);
 });
}
function runCommand(el,cmd){
 const out=el.querySelector('.term-out');let response='';const bits=cmd.split(/\s+/);const c=(bits[0]||'').toLowerCase();const arg=bits.slice(1).join(' ');
 if(!cmd)response='';
 else if(c==='help')response='Доступные команды:\n help — список команд\n apps — список приложений\n open <имя> — открыть приложение\n theme <neon|ocean|violet> — сменить тему\n time — текущее время\n about — сведения о системе\n clear — очистить терминал\n plans — этапы развития CLOSE OS';
 else if(c==='apps')response=apps.map(a=>a.id+' — '+a.name).join('\n');
 else if(c==='open'){const target=apps.find(a=>a.id===arg.toLowerCase()||a.name.toLowerCase().includes(arg.toLowerCase()));if(target){response='Запуск: '+target.name;setTimeout(()=>openApp(target.id),80)}else response='Приложение не найдено. Введите apps.'}
 else if(c==='theme'){if(['neon','ocean','violet'].includes(arg)){state.theme=arg;persist();applyTheme();response='Тема изменена: '+arg}else response='Использование: theme neon | ocean | violet'}
 else if(c==='time')response=new Date().toLocaleString('ru-RU');
 else if(c==='about')response='CLOSE OS 0.1.0\nЮбилейное приложение №20 CloseApps.\nВеб-оболочка, работает в браузере.';
 else if(c==='clear'){out.textContent='';return}
 else if(c==='plans')response='Этап 1: рабочий стол и окна ✓\nЭтап 2: файловая система и резервное копирование\nЭтап 3: ядро и расширенные команды\nЭтап 4: магазин модулей\nЭтап 5: синхронизация между устройствами';
 else response='Неизвестная команда: '+cmd+'. Введите help.';
 out.textContent+='\nclose> '+cmd+'\n'+response+'\n';
 const terminal=el.querySelector('#terminal');terminal.scrollTop=terminal.scrollHeight;
}
function calculate(el){const input=el.querySelector('#calcDisplay'),result=el.querySelector('#calcResult');const expr=input.value.trim();if(!expr){result.textContent='Введите выражение.';return}if(!/^[0-9+\-*/().%\s]+$/.test(expr)){result.textContent='Допустимы только числа и арифметические операторы.';return}try{const value=Function('"use strict";return ('+expr+')')();result.textContent=Number.isFinite(value)?'Результат: '+value:'Проверьте выражение.'}catch(e){result.textContent='Не удалось вычислить выражение.'}}
function goUrl(value){let url=value.trim();if(!url)return; if(!/^https?:\/\//i.test(url))url='https://'+url;try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw 0;window.open(u.href,'_blank','noopener,noreferrer')}catch(e){toast('Проверьте адрес сайта')}}
function exportData(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='close-os-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Резервная копия подготовлена')}
function applyTheme(){const root=document.documentElement;if(state.theme==='ocean'){root.style.setProperty('--cyan','#67f4d5');root.style.setProperty('--violet','#438bff');$('#os').style.background='radial-gradient(ellipse at 15% 15%,#0c626a,transparent 36%),radial-gradient(ellipse at 80% 15%,#174b9a,transparent 35%),linear-gradient(135deg,#050f1b,#071b2b)'}else if(state.theme==='violet'){root.style.setProperty('--cyan','#d0a2ff');root.style.setProperty('--violet','#7c4dff');$('#os').style.background='radial-gradient(ellipse at 15% 15%,#51237a,transparent 38%),radial-gradient(ellipse at 80% 15%,#272b70,transparent 35%),linear-gradient(135deg,#10071c,#0b1024)'}else{root.style.setProperty('--cyan','#55e7ff');root.style.setProperty('--violet','#9a7bff');$('#os').style.background='radial-gradient(ellipse at 18% 15%,#263c75 0,transparent 35%),radial-gradient(ellipse at 82% 20%,#40216b 0,transparent 34%),radial-gradient(ellipse at 55% 95%,#063d50 0,transparent 36%),linear-gradient(135deg,#080b18,#0b1024 55%,#080b18)'}}
function renderAppList(filter=''){const list=$('#appList');list.innerHTML='';apps.filter(a=>(a.name+' '+a.id+' '+a.desc).toLowerCase().includes(filter.toLowerCase())).forEach(a=>{const b=document.createElement('button');b.className='app-item';b.innerHTML='<span>'+a.icon+'</span><span>'+safe(a.name)+'</span>';b.addEventListener('click',()=>{openApp(a.id);$('#startMenu').classList.add('hidden')});list.append(b)})}
$('#startBtn').addEventListener('click',()=>{$('#startMenu').classList.toggle('hidden');renderAppList();if(!$('#startMenu').classList.contains('hidden'))$('#appSearch').focus()});
$('#appSearch').addEventListener('input',e=>renderAppList(e.target.value));
$$('[data-app]').forEach(b=>b.addEventListener('click',()=>openApp(b.dataset.app)));
$('#powerBtn').addEventListener('click',()=>toast('CLOSE OS работает в браузере — вкладку можно закрыть безопасно.'));
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#startMenu').classList.remove('hidden');$('#appSearch').focus()}if(e.key==='Escape')$('#startMenu').classList.add('hidden')});
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});$('#date').textContent=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase()}
tick();setInterval(tick,1000);applyTheme();renderAppList();
setTimeout(()=>openApp('welcome'),350);
})();
</script>
</body></html>
