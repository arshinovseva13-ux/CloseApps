<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131f"><title>Close Date</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 16px;background:radial-gradient(ellipse at top,#1e3d40,#0b1216 65%);color:#f0fffd;font:16px/1.5 system-ui,sans-serif}.wrap{max-width:800px;margin:auto}.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}.brand{font-size:13px;letter-spacing:.15em;color:#a4c9c7}h1{font-size:clamp(34px,7vw,58px);margin:14px 0 4px}.sub{color:#a4c9c7}.panel{margin-top:24px;padding:clamp(16px,4vw,28px);border:1px solid #31595a;border-radius:22px;background:#122326ee;box-shadow:0 20px 60px #0005}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab,button{border:1px solid #356465;border-radius:12px;background:#1d3739;color:#f0fffd;padding:11px 14px;cursor:pointer;font-weight:700}.tab.active,button.primary{background:#8ce3d5;color:#0c2826;border-color:#8ce3d5}.mode{display:none;margin-top:20px}.mode.active{display:block}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.fields label{color:#a4c9c7;font-size:13px}.fields input{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #31595a;border-radius:10px;background:#0b1719;color:white;font:inherit}.result{margin:18px 0;padding:22px;border-radius:18px;background:#0b1719;border:1px solid #31595a}.big{font-size:clamp(30px,7vw,50px);font-weight:800;color:#8ce3d5}.muted{color:#a4c9c7;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}@media(max-width:500px){.fields{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><div class="top"><div class="brand">CLOSE APPS / DATE UTILITIES</div><a href="../" style="color:#8ce3d5;text-decoration:none">← На главную</a></div><h1>Close Date</h1><p class="sub">Посчитай разницу между датами или узнай, какая дата получится через заданное количество дней.</p><section class="panel"><div class="tabs"><button class="tab active" data-mode="diff">Разница дат</button><button class="tab" data-mode="add">Прибавить дни</button></div><div class="mode active" id="diff"><div class="fields"><label>Начальная дата<input id="start" type="date"></label><label>Конечная дата<input id="end" type="date"></label></div><div class="result"><div class="big" id="days">—</div><div class="muted" id="detail">Выбери две даты</div></div><button class="primary" id="calc">Рассчитать разницу</button></div><div class="mode" id="add"><div class="fields"><label>Начальная дата<input id="base" type="date"></label><label>Количество дней<input id="amount" type="number" value="30" min="-100000" max="100000"></label></div><div class="result"><div class="big" id="future">—</div><div class="muted" id="futureDetail">Дата появится после расчёта</div></div><button class="primary" id="addDays">Рассчитать дату</button></div><p class="muted">Расчёт выполняется в календарных днях, без учёта времени суток.</p></section></main><script>
const $=s=>document.querySelector(s),today=new Date(),iso=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)},fmt=d=>new Intl.DateTimeFormat('ru-RU',{day:'numeric',month:'long',year:'numeric'}).format(d);$('#start').value=iso(today);$('#end').value=iso(today);$('#base').value=iso(today);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x.id===b.dataset.mode))});function utc(s){if(!s)return NaN;const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)}$('#calc').onclick=()=>{let a=utc($('#start').value),b=utc($('#end').value);if(!Number.isFinite(a)||!Number.isFinite(b)){alert('Укажи обе даты.');return}let n=Math.round(Math.abs(b-a)/86400000);$('#days').textContent=n+' '+(n%10===1&&n%100!==11?'день':n%10>=2&&n%10<=4&&(n%100<12||n%100>14)?'дня':'дней');$('#detail').textContent=(b<a?'Конечная дата раньше начальной. ':'')+'Между '+fmt(new Date(a))+' и '+fmt(new Date(b))+'.'};$('#addDays').onclick=()=>{let a=utc($('#base').value),n=Number($('#amount').value);if(!Number.isFinite(a)||!Number.isFinite(n)||!Number.isInteger(n)){alert('Укажи дату и целое количество дней.');return}let d=new Date(a+n*86400000);$('#future').textContent=fmt(d);$('#futureDetail').textContent=(n>=0?'Через ':'Назад на ')+Math.abs(n)+' '+(Math.abs(n)%10===1&&Math.abs(n)%100!==11?'день':'дней')+'.'};$('#calc').click();
</script></body></html>
