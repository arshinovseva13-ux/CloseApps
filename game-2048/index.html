<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 — CloseApps</title><style>*{box-sizing:border-box}body{margin:0;background:#171923;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:16px}.app{width:min(100%,460px)}a{color:#bdb0ff}header,.stats,.actions{display:flex;justify-content:space-between;gap:8px;align-items:center}h1{font-size:48px;color:#f4c96a;margin:20px 0}.stat{background:#343344;border-radius:9px;padding:7px 14px;text-align:center}.stat small{display:block;color:#bbb;font-size:10px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#34323e;padding:9px;border-radius:14px;touch-action:none}.cell{aspect-ratio:1;background:#4a4854;border-radius:8px;display:grid;place-items:center;font-size:clamp(22px,7vw,36px);font-weight:900;color:#4a4854}.v2{background:#eee4da}.v4{background:#ede0c8}.v8{background:#f2b179;color:white}.v16{background:#f59563;color:white}.v32{background:#f67c5f;color:white}.v64{background:#f65e3b;color:white}.v128,.v256,.v512{background:#edcf72;color:white}.v1024,.v2048{background:#e9bd42;color:white;font-size:22px}button{border:0;border-radius:9px;padding:11px 14px;background:#6654a3;color:white;font-weight:bold;margin-top:12px}p{color:#bbb;line-height:1.5}</style><main class="app"><header><b>CLOSEAPPS / MINI GAMES</b><a href="../">← Каталог</a></header><div class="stats"><h1>2048</h1><div class="stat"><small>СЧЁТ</small><b id="score">0</b></div><div class="stat"><small>РЕКОРД</small><b id="best">0</b></div></div><div class="board" id="board"></div><p>Соединяй одинаковые числа. Управление: стрелки или свайпы.</p><div class="actions"><button id="undo">↶ Отменить</button><button id="restart">Новая игра</button></div><p id="msg"></p></main><script>let a=[],score=0,best=+(localStorage.best2048||0),prev=null;const el=id=>document.getElementById(id);function spawn(){let e=a.map((v,i)=>v? -1:i).filter(i=>i>=0);if(e.length)a[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}function draw(){el('board').innerHTML=a.map(v=>'<div class="cell '+(v?'v'+v:'')+'">'+(v||'')+'</div>').join('');el('score').textContent=score;el('best').textContent=best}function reset(){a=Array(16).fill(0);score=0;prev=null;spawn();spawn();el('msg').textContent='';draw()}function move(d){let old=a.slice(),sc=score;for(let n=0;n<4;n++){let ids=Array.from({length:4},(_,i)=>d==='left'?n*4+i:d==='right'?n*4+3-i:d==='up'?i*4+n:(3-i)*4+n),v=ids.map(i=>a[i]).filter(Boolean),o=[];for(let i=0;i<v.length;i++){if(v[i]===v[i+1]){o.push(v[i]*2);score+=v[i]*2;i++}else o.push(v[i])}while(o.length<4)o.push(0);ids.forEach((id,i)=>a[id]=o[i])}if(a.every((v,i)=>v===old[i])){score=sc;return}prev={a:old,score:sc};spawn();if(score>best){best=score;localStorage.best2048=best}draw();if(a.includes(2048))el('msg').textContent='🎉 Ты собрал 2048!';if(!a.includes(0)&&!a.some((v,i)=>i%4<3&&v===a[i+1]||i<12&&v===a[i+4]))el('msg').textContent='Игра окончена!'}document.addEventListener('keydown',e=>{let d={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'}[e.key];if(d){e.preventDefault();move(d)}});let x=0,y=0;el('board').ontouchstart=e=>{x=e.touches[0].clientX;y=e.touches[0].clientY};el('board').ontouchend=e=>{let dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(Math.max(Math.abs(dx),Math.abs(dy))>25)move(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')};el('restart').onclick=reset;el('undo').onclick=()=>{if(prev){a=prev.a;score=prev.score;prev=null;draw()}};reset();</script></main></html>
