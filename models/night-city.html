<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

// =====================================================================
//  basics
// =====================================================================
const QS = new URLSearchParams(location.search);
const FREEZE = QS.has('t') ? parseFloat(QS.get('t')) : null;
const LOOP = 30;

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rand = mulberry32(8061527);
const R = (a=0,b=1)=>a+(b-a)*rand();
const RI = (a,b)=>Math.floor(R(a,b+1-1e-9));
const pick = a=>a[Math.floor(rand()*a.length)];
const chance = p=>rand()<p;
const snap = v=>Math.round(v*4)/4;
const clamp = (v,a,b)=>v<a?a:(v>b?b:v);
const lerp = (a,b,t)=>a+(b-a)*t;
const smooth = t=>t*t*(3-2*t);
function hashf(n){ const s=Math.sin(n*127.1+311.7)*43758.5453; return s-Math.floor(s); }

const _cc = new Map();
function C3(v){ if (v && v.isColor) return v; let c=_cc.get(v); if(!c){ c=new THREE.Color(v); _cc.set(v,c);} return c; }
const shade = (hex,k)=>new THREE.Color(hex).multiplyScalar(k);
const E3 = (rgb,k)=>new THREE.Color(rgb[0]*k, rgb[1]*k, rgb[2]*k);

const LC = {
  bulb:[1.0,0.58,0.26], warm:[1.0,0.48,0.16], warmWhite:[1.0,0.80,0.58], cool:[0.78,0.90,1.0], sodium:[1.0,0.52,0.18],
  pink:[1.0,0.10,0.48], cyan:[0.06,0.85,1.0], red:[1.0,0.07,0.04], green:[0.12,1.0,0.38], yellow:[1.0,0.72,0.08],
  purple:[0.62,0.16,1.0], blue:[0.16,0.32,1.0], orange:[1.0,0.34,0.05], white:[1.0,0.95,0.9], lantern:[1.0,0.16,0.05]
};

// =====================================================================
//  renderer / scene
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance', stencil:false });
const PR = Math.min(window.devicePixelRatio||1, 1.5);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x020308);
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 1200);

// =====================================================================
//  shared uniforms / shaders
// =====================================================================
// clustered lighting: all static lights live in a float texture, a 2D grid of
// cells (xz) stores the indices of the lights that can reach each cell.
const MAXL = 256, NSLOT = 28, GCS = 3.0, GNX = 17, GNZ = 15, GOX = -25.5, GOZ = -21.5, NDYN = 4;
const LDATA = new Float32Array(MAXL*2*4);
const LTEX = new THREE.DataTexture(LDATA, MAXL, 2, THREE.RGBAFormat, THREE.FloatType);
LTEX.minFilter = LTEX.magFilter = THREE.NearestFilter; LTEX.needsUpdate = true;
const CDATA = new Float32Array(NSLOT*GNX*GNZ*4).fill(-1);
const CTEX = new THREE.DataTexture(CDATA, NSLOT, GNX*GNZ, THREE.RGBAFormat, THREE.FloatType);
CTEX.minFilter = CTEX.magFilter = THREE.NearestFilter; CTEX.needsUpdate = true;
const U = {
  uTime:{value:0},
  uLTex:{value:LTEX}, uCTex:{value:CTEX},
  uDP:{value:Array.from({length:NDYN},()=>new THREE.Vector4(0,-200,0,0.01))},
  uDC:{value:Array.from({length:NDYN},()=>new THREE.Vector3())},
  uFogC:{value:new THREE.Vector3(0.016,0.017,0.036)},
  uFogD:{value:0.0052},
  uSkyAmb:{value:new THREE.Vector3(0.052,0.056,0.105)},
  uGndAmb:{value:new THREE.Vector3(0.026,0.02,0.024)},
  uG:{value:new Float32Array(32).fill(1)},
};
const GV = U.uG.value;

const GLC = /* glsl */`
#define NSLOT ${NSLOT}
#define NDYN ${NDYN}
uniform sampler2D uLTex;
uniform sampler2D uCTex;
uniform vec4 uDP[NDYN];
uniform vec3 uDC[NDYN];
uniform float uTime;
uniform vec3 uFogC;
uniform float uFogD;
float h13(vec3 p3){ p3=fract(p3*0.1031); p3+=dot(p3,p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
float h12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float fogF(vec3 wp){
  float d = length(wp - cameraPosition);
  float f = 1.0 - exp(-d*uFogD);
  float mist = (1.0 - exp(-d*0.05)) * exp(-max(wp.y,0.0)*0.22) * 0.2;
  return clamp(f + mist, 0.0, 0.97);
}
int cellOf(vec3 p){
  ivec2 c = ivec2(floor((p.xz - vec2(${GOX.toFixed(2)}, ${GOZ.toFixed(2)})) / ${GCS.toFixed(2)}));
  c = clamp(c, ivec2(0), ivec2(${GNX-1}, ${GNZ-1}));
  return c.y*${GNX} + c.x;
}
vec3 lightAt(vec3 p){
  vec3 acc = vec3(0.0);
  int ci = cellOf(p);
  for (int s=0;s<NSLOT;s++){
    float li = texelFetch(uCTex, ivec2(s, ci), 0).r;
    if (li < 0.0) break;
    int i = int(li);
    vec4 lp = texelFetch(uLTex, ivec2(i,0), 0);
    vec3 d = lp.xyz - p; float d2 = dot(d,d); float r2 = lp.w*lp.w;
    if (d2 > r2) continue;
    float x = d2/r2; acc += texelFetch(uLTex, ivec2(i,1), 0).rgb*(1.0-x)*(1.0-x)/(1.0+d2*0.9);
  }
  for (int i=0;i<NDYN;i++){
    vec3 d = uDP[i].xyz - p; float d2 = dot(d,d); float r2 = uDP[i].w*uDP[i].w;
    if (d2 > r2) continue;
    float x = d2/r2; acc += uDC[i]*(1.0-x)*(1.0-x)/(1.0+d2*0.9);
  }
  return acc;
}
void addL(vec4 lp, vec3 lcol, vec3 p, vec3 n, vec3 V, float wet, inout vec3 acc, inout vec3 spec){
  vec3 L = lp.xyz - p; float d2 = dot(L,L); float r2 = lp.w*lp.w;
  if (d2 > r2) return;
  float d = sqrt(d2); L /= max(d,1e-4);
  float x = d2/r2; float att = (1.0-x)*(1.0-x)/(1.0+d2*0.9);
  float ndl = dot(n,L);
  vec3 lc = lcol*att;
  acc += lc*(max(ndl,0.0)*0.85 + 0.15*clamp(ndl+0.5,0.0,1.0));
  if (ndl > 0.0 && wet > 0.0){ vec3 H = normalize(L+V); spec += lc*pow(max(dot(n,H),0.0),40.0)*wet; }
}
vec3 lightN(vec3 p, vec3 n, vec3 V, float wet, out vec3 spec){
  vec3 acc = vec3(0.0); spec = vec3(0.0);
  int ci = cellOf(p);
  for (int s=0;s<NSLOT;s++){
    float li = texelFetch(uCTex, ivec2(s, ci), 0).r;
    if (li < 0.0) break;
    int i = int(li);
    addL(texelFetch(uLTex, ivec2(i,0), 0), texelFetch(uLTex, ivec2(i,1), 0).rgb, p, n, V, wet, acc, spec);
  }
  for (int i=0;i<NDYN;i++) addL(uDP[i], uDC[i], p, n, V, wet, acc, spec);
  return acc;
}
`;

function solidMat(grid){
  return new THREE.ShaderMaterial({
    uniforms:{ ...U, uGrid:{value:grid?1:0} },
    vertexShader:/* glsl */`
      varying vec3 vW; varying vec3 vN; varying vec3 vC;
      void main(){
        vec4 wp = modelMatrix*instanceMatrix*vec4(position,1.0);
        vN = normalize(mat3(modelMatrix)*mat3(instanceMatrix)*normal);
        #ifdef USE_INSTANCING_COLOR
          vC = instanceColor;
        #else
          vC = vec3(1.0);
        #endif
        vW = wp.xyz;
        gl_Position = projectionMatrix*viewMatrix*wp;
      }`,
    fragmentShader: GLC + /* glsl */`
      uniform float uGrid; uniform vec3 uSkyAmb; uniform vec3 uGndAmb;
      varying vec3 vW; varying vec3 vN; varying vec3 vC;
      void main(){
        vec3 n = normalize(vN);
        vec3 base = vC;
        if (uGrid > 0.5){
          vec3 q = vW*4.0 - n*0.02;
          base *= 0.86 + 0.26*h13(floor(q));
          vec3 f = fract(q); vec3 an = abs(n);
          vec2 t2 = an.x>0.5 ? f.yz : (an.y>0.5 ? f.xz : f.xy);
          vec2 e = min(t2, 1.0-t2);
          float fw = length(fwidth(q));
          float seam = smoothstep(0.015, 0.06+fw, min(e.x,e.y));
          base *= mix(1.0, 0.80+0.20*seam, clamp(1.3-fw*1.6,0.0,1.0));
        }
        vec3 V = normalize(cameraPosition - vW);
        vec3 amb = mix(uGndAmb, uSkyAmb, n.y*0.5+0.5);
        float ao = 0.42 + 0.58*smoothstep(-0.05, 1.5, vW.y);
        if (vW.y < -0.05) amb += vec3(0.11,0.085,0.075)*(0.6+0.4*smoothstep(-4.6,-0.3,vW.y));
        vec3 spec;
        float wet = n.y > 0.5 ? 1.0 : 0.22;
        vec3 diff = lightN(vW, n, V, wet, spec);
        vec3 col = base*(amb*ao + diff) + spec*0.22;
        col = mix(col, uFogC, fogF(vW));
        gl_FragColor = vec4(col, 1.0);
      }`
  });
}

const emissiveMat = new THREE.ShaderMaterial({
  uniforms:{ ...U },
  vertexShader: GLC + /* glsl */`
    uniform float uG[32];
    attribute float aGroup;
    varying vec3 vC; varying vec3 vW; varying float vI; varying vec3 vN;
    vec3 hsv(vec3 c){ vec4 K=vec4(1.0,2.0/3.0,1.0/3.0,3.0); vec3 p=abs(fract(c.xxx+K.xyz)*6.0-K.www); return c.z*mix(K.xxx,clamp(p-K.xxx,0.0,1.0),c.y); }
    void main(){
      vec4 wp = modelMatrix*instanceMatrix*vec4(position,1.0);
      #ifdef USE_INSTANCING_COLOR
        vC = instanceColor;
      #else
        vC = vec3(1.0);
      #endif
      vW = wp.xyz; vN = normalize(mat3(instanceMatrix)*normal);
      int g = int(aGroup+0.5);
      if (g < 32) vI = uG[g];
      else if (g == 40){
        float w = 0.5+0.5*sin(wp.y*0.32 - uTime*2.2);
        w = pow(w, 5.0);
        vC = hsv(vec3(fract(uTime*0.035 + wp.y*0.004), 0.7, 1.0))*length(vC)*0.75;
        vI = 0.10 + 1.7*w;
      } else if (g == 41){
        float w = 0.5+0.5*sin((wp.x+wp.z)*0.5 - uTime*3.0);
        vC = hsv(vec3(fract(uTime*0.035 + 0.5), 0.6, 1.0))*length(vC)*0.75;
        vI = 0.2 + 1.2*pow(w,3.0);
      } else vI = 1.0;
      gl_Position = projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader: GLC + /* glsl */`
    varying vec3 vC; varying vec3 vW; varying float vI; varying vec3 vN;
    void main(){
      vec3 c = vC*vI*(0.86+0.14*abs(vN.y));
      c = mix(c, uFogC, fogF(vW)*0.7);
      gl_FragColor = vec4(c,1.0);
    }`
});

const particleMat = new THREE.ShaderMaterial({
  uniforms:{ ...U },
  vertexShader: GLC + /* glsl */`
    varying vec3 vC;
    void main(){
      vec4 wp = modelMatrix*instanceMatrix*vec4(position,1.0);
      vec3 c0 = (modelMatrix*instanceMatrix*vec4(0.0,0.0,0.0,1.0)).xyz;
      vec3 L = vec3(0.07,0.075,0.11) + lightAt(c0);
      #ifdef USE_INSTANCING_COLOR
        vC = instanceColor*L;
      #else
        vC = L;
      #endif
      vC *= 1.0 - fogF(c0);
      gl_Position = projectionMatrix*viewMatrix*wp;
    }`,
  fragmentShader: /* glsl */`
    varying vec3 vC;
    void main(){ gl_FragColor = vec4(vC, 1.0); }`,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
});

const matGrid = solidMat(true);
const matFree = solidMat(false);
const unitBox = new THREE.BoxGeometry(1,1,1);

// =====================================================================
//  height grid (for rain collision)
// =====================================================================
const HGX=96, HGZ=80, HG = new Float32Array(HGX*HGZ);
function heightAdd(x0,z0,w,d,top){
  const i0=Math.ceil((x0+24)/0.5-0.5), i1=Math.floor((x0+w+24)/0.5-0.5);
  const j0=Math.ceil((z0+20)/0.5-0.5), j1=Math.floor((z0+d+20)/0.5-0.5);
  for (let j=Math.max(0,j0); j<=Math.min(HGZ-1,j1); j++) for (let i=Math.max(0,i0); i<=Math.min(HGX-1,i1); i++){
    const k=j*HGX+i; if (top>HG[k]) HG[k]=top;
  }
}
function heightAt(x,z){ const i=clamp(Math.floor((x+24)/0.5),0,HGX-1), j=clamp(Math.floor((z+20)/0.5),0,HGZ-1); return HG[j*HGX+i]; }

// =====================================================================
//  instanced batches
// =====================================================================
class Batch{
  constructor(mat, useH=false){ this.material=mat; this.P=[]; this.C=[]; this.G=[]; this.useH=useH; }
  box(x0,y0,z0,w,h,d,c,g=0){
    if (!(w>0&&h>0&&d>0)) return;
    const cc=C3(c);
    this.P.push(w,0,0,0, 0,h,0,0, 0,0,d,0, x0+w/2,y0+h/2,z0+d/2,1);
    this.C.push(cc.r,cc.g,cc.b); this.G.push(g);
    if (this.useH && w*d > 0.05) heightAdd(x0,z0,w,d,y0+h);
  }
  boxC(cx,cy,cz,w,h,d,c,g=0){ this.box(cx-w/2,cy-h/2,cz-d/2,w,h,d,c,g); }
  mat(e,c,g=0){ const cc=C3(c); for(let i=0;i<16;i++) this.P.push(e[i]); this.C.push(cc.r,cc.g,cc.b); this.G.push(g); }
  build(){
    const n=this.G.length, geo=unitBox.clone();
    geo.setAttribute('aGroup', new THREE.InstancedBufferAttribute(new Float32Array(this.G),1));
    const mesh=new THREE.InstancedMesh(geo,this.material,n);
    mesh.instanceMatrix.array.set(this.P);
    mesh.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(this.C),3);
    mesh.frustumCulled=false;
    return mesh;
  }
}
class Dyn{
  constructor(mat,max){
    const geo=unitBox.clone();
    geo.setAttribute('aGroup', new THREE.InstancedBufferAttribute(new Float32Array(max),1));
    this.mesh=new THREE.InstancedMesh(geo,mat,max);
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.mesh.instanceColor=new THREE.InstancedBufferAttribute(new Float32Array(max*3),3);
    this.mesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
    this.mesh.frustumCulled=false; this.max=max; this.n=0;
    this.A=this.mesh.instanceMatrix.array; this.Cc=this.mesh.instanceColor.array;
  }
  begin(){ this.n=0; }
  box(cx,cy,cz,sx,sy,sz,ry,r,g,b){
    if (this.n>=this.max) return; const o=this.n*16, A=this.A, c=Math.cos(ry), s=Math.sin(ry);
    A[o]=c*sx;A[o+1]=0;A[o+2]=-s*sx;A[o+3]=0;A[o+4]=0;A[o+5]=sy;A[o+6]=0;A[o+7]=0;
    A[o+8]=s*sz;A[o+9]=0;A[o+10]=c*sz;A[o+11]=0;A[o+12]=cx;A[o+13]=cy;A[o+14]=cz;A[o+15]=1;
    const k=this.n*3; this.Cc[k]=r;this.Cc[k+1]=g;this.Cc[k+2]=b; this.n++;
  }
  mat(e,r,g,b){
    if (this.n>=this.max) return; const o=this.n*16; for(let i=0;i<16;i++) this.A[o+i]=e[i];
    const k=this.n*3; this.Cc[k]=r;this.Cc[k+1]=g;this.Cc[k+2]=b; this.n++;
  }
  end(){ this.mesh.count=this.n; this.mesh.instanceMatrix.needsUpdate=true; this.mesh.instanceColor.needsUpdate=true; }
}

const S  = new Batch(matGrid, true);   // structure (voxel grid shading)
const FB = new Batch(matFree, false);  // props & details
const E  = new Batch(emissiveMat);     // static light sources

// =====================================================================
//  lights registry
// =====================================================================
const LIGHTS = [], DYNL = [];
function addLight(x,y,z,c,i,r,fn){ const L={x,y,z,c,i,r,fn}; LIGHTS.push(L); return L; }
function addDynLight(c,r){ const L={x:0,y:-50,z:0,c,i:0,r}; DYNL.push(L); return L; }
// assign static lights to grid cells (most important first)
function binLights(){
  let maxN=0, over=0;
  const n=Math.min(LIGHTS.length,MAXL);
  for(let cz=0;cz<GNZ;cz++) for(let cx=0;cx<GNX;cx++){
    const x0=GOX+cx*GCS, z0=GOZ+cz*GCS, x1=x0+GCS, z1=z0+GCS, mx=(x0+x1)/2, mz=(z0+z1)/2;
    const list=[];
    for(let i=0;i<n;i++){ const L=LIGHTS[i];
      const dx=Math.max(x0-L.x,0,L.x-x1), dz=Math.max(z0-L.z,0,L.z-z1);
      if (dx*dx+dz*dz > L.r*L.r) continue;
      const dc=(L.x-mx)**2+(L.z-mz)**2;
      list.push([i, L.i*L.r/(1+dc*0.25)]);
    }
    list.sort((a,b)=>b[1]-a[1]);
    maxN=Math.max(maxN,list.length); if(list.length>NSLOT) over++;
    const ci=cz*GNX+cx;
    for(let s=0;s<NSLOT;s++) CDATA[(ci*NSLOT+s)*4]= s<list.length?list[s][0]:-1;
  }
  CTEX.needsUpdate=true;
  console.log('light grid: max per cell',maxN,'cells over budget',over);
}

// =====================================================================
//  text -> voxel bitmaps (rasterised from a system CJK font)
// =====================================================================
const gcv=document.createElement('canvas'), gctx=gcv.getContext('2d',{willReadFrequently:true});
const FONT_CN='"Microsoft YaHei","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","WenQuanYi Micro Hei","SimHei",sans-serif';
const _bmCache=new Map();
function rasterize(text,px){
  const key=text+'|'+px; if(_bmCache.has(key)) return _bmCache.get(key);
  const font=`bold ${px}px ${FONT_CN}`;
  gctx.font=font;
  const w=Math.max(1,Math.ceil(gctx.measureText(text).width))+4, h=Math.ceil(px*1.4)+4;
  gcv.width=w; gcv.height=h;
  gctx.font=font; gctx.fillStyle='#fff'; gctx.textBaseline='middle'; gctx.clearRect(0,0,w,h);
  gctx.fillText(text,2,h/2);
  const d=gctx.getImageData(0,0,w,h).data;
  let x0=w,x1=-1,y0=h,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++) if(d[(y*w+x)*4+3]>118){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  let res;
  if (x1<0) res={w:1,h:1,B:new Uint8Array(1)};
  else {
    const bw=x1-x0+1, bh=y1-y0+1, B=new Uint8Array(bw*bh);
    for(let y=0;y<bh;y++)for(let x=0;x<bw;x++) B[y*bw+x]=d[((y+y0)*w+(x+x0))*4+3]>118?1:0;
    res={w:bw,h:bh,B};
  }
  res.get=(x,y)=>(x>=0&&y>=0&&x<res.w&&y<res.h)?res.B[(res.h-1-y)*res.w+x]:0;
  _bmCache.set(key,res); return res;
}
function textBitmap(text,px,vertical){
  if(!vertical) return rasterize(text,px);
  const chars=[...text].map(ch=>rasterize(ch,px));
  const gap=Math.max(1,Math.round(px*0.2));

function addHidePois(){

function choosePoi(w){
  for(let tries=0;tries<10;tries++){
    const r=rand(); let cands;
    if (r<0.5) cands=POIS.filter(p=>p.type==='stall'&&p.region==='street');
    else if (r<0.66) cands=POIS.filter(p=>p.type==='hide');
    else if (r<0.82) cands=POIS.filter(p=>p.region==='plaza');
    else if (r<0.93) cands=POIS.filter(p=>p.region==='alley');
    else cands=POIS.filter(p=>p.type==='shop');
    if (!cands.length) continue;
    const p=pick(cands); if (p!==w.poi) return p;
  }

}
function plan(w,poi){

    if (cur.via) for(let i=cur.via.length-1;i>=0;i--) r.push(cur.via[i]);
    if (cur.region!=='street'){ const g=GATES[cur.region]; r.push(g[1],g[0]); }
  }
  if (poi.region!=='street'){ const g=GATES[poi.region]; r.push(g[0],g[1]); }
  if (poi.via) r.push(...poi.via);
  r.push(poi);
  w.route=r.map((p,i)=>i===r.length-1?{x:p.x,z:p.z}:{x:p.x+R(-0.3,0.3),z:p.z+R(-0.25,0.25)});

function arrive(w){

  else if (p.type==='pray'){ w.timer=R(5,8); w.act='pray'; }
  else if (p.type==='chat'){ w.timer=R(5,11); w.act=chance(0.5)?'phone':'chat'; w.yawT=R(0,6.28); }

function angLerp(a,b,t){ let d=b-a; while(d>Math.PI) d-=Math.PI*2; while(d<-Math.PI) d+=Math.PI*2; return a+d*t; }

};
function emitOne(type,x,y,z,spread){
  if (PARTS.length>2400) return;
  if (type==='spark'){ PARTS.push({type,x:x+R(-spread,spread),y,z:z+R(-0.15,0.15),vx:R(-0.2,0.2),vy:R(1.0,2.2),vz:R(-0.2,0.2),age:0,life:R(0.5,1.1),em:true}); return; }
  if (type==='food'){ PARTS.push({type,x,y,z,vx:R(-0.4,0.4),vy:R(1.5,2.2),vz:R(-0.4,0.4),age:0,life:0.5,c:pick(FOODC)}); return; }
  const d=PT[type];
  PARTS.push({type,x:x+R(-spread,spread),y,z:z+R(-spread,spread),vx:R(-0.05,0.05),vy:R(d.vy[0],d.vy[1]),vz:R(-0.05,0.05),age:0,life:R(d.life[0],d.life[1]),rot:R(0,6.28),rs:R(-0.8,0.8)});
}
const FOODC=[C3(0xe8c060),C3(0xd04a20),C3(0x5a9a3a),C3(0xf0e0b0)];
function emitBurst(type,x,y,z,n){ for(let i=0;i<n;i++) emitOne(type,x,y,z,0.05); }
const WIND={x:0.22,z:0.06};
function updateParticles(dt,t){
  for(const e of EMIT){ e.acc+=e.rate*dt*(e.on??1); while(e.acc>=1){ e.acc-=1; emitOne(e.type,e.x,e.y,e.z,e.spread); } }
  for(let i=PARTS.length-1;i>=0;i--){
    const p=PARTS[i]; p.age+=dt; if (p.age>=p.life){ PARTS[i]=PARTS[PARTS.length-1]; PARTS.pop(); continue; }
    if (p.type==='spark'){ p.vy-=1.2*dt; p.vx+=WIND.x*dt; }
    else if (p.type==='food'){ p.vy-=9.8*dt; }
    else if (p.type!=='drip') { const d=PT[p.type]; const u=p.age/p.life; p.vy*=1-d.drag*dt*0.5; p.vx+=(WIND.x*u+Math.sin(t*1.3+p.y*2.0)*0.08)*dt; p.vz+=(WIND.z*u+Math.cos(t*1.1+p.x*2.0)*0.06)*dt; p.rot+=p.rs*dt; }
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
  }
  // drips
  for(const d of DRIPS){ d.t+=dt; if(d.t>d.per){ d.t=0; d.per=R(0.6,2.5); PARTS.push({type:'drip',x:d.x,y:d.y,z:d.z,vx:0,vy:-0.3,vz:0,age:0,life:Math.sqrt(2*d.y/9.8)+0.02}); } }
  for(const p of PARTS) if(p.type==='drip') p.vy-=9.8*dt;
}
function drawParticles(t){

    const u=p.age/p.life;
    if (p.type==='spark'){ const k=(1-u)*(1-u)*6; dynE.box(p.x,p.y,p.z,0.03,0.03,0.03,0,1.0*k,0.4*k,0.08*k); continue; }

    const d=PT[p.type]; const s=lerp(d.s0,d.s1,Math.sqrt(u)); const a=d.a*smooth(Math.min(1,u*6))*Math.pow(1-u,1.4);
    dynP.box(p.x,p.y,p.z,s,s,s,p.rot,d.col[0]*a,d.col[1]*a,d.col[2]*a);

}

function buildRain(){
  const N=10000, pos=new Float32Array(N*6), aD=new Float32Array(N*8), aE=new Float32Array(N*2);
  for(let i=0;i<N;i++){ const x=R(-23.9,23.9), z=R(-19.9,19.9), fl=heightAt(x,z), ph=rand();
    for(let e=0;e<2;e++){ const k=i*2+e; aD[k*4]=x; aD[k*4+1]=z; aD[k*4+2]=ph; aD[k*4+3]=fl; aE[k]=e; } }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aDrop',new THREE.BufferAttribute(aD,4));
  g.setAttribute('aEnd',new THREE.BufferAttribute(aE,1));
  const m=new THREE.ShaderMaterial({ uniforms:{...U},
    vertexShader: GLC + /* glsl */`
      attribute vec4 aDrop; attribute float aEnd; varying vec3 vC; varying float vA;
      void main(){
        float top = 48.0, H = top - aDrop.w;
        float sp = 10.0 + fract(aDrop.z*91.7)*4.0;
        float y = aDrop.w + mod(aDrop.z*H*7.0 - uTime*sp, H);
        vec3 p = vec3(aDrop.x + (y-aDrop.w)*0.07 - 0.0, y, aDrop.y + (y-aDrop.w)*0.025);
        vec3 dir = normalize(vec3(-0.07,-1.0,-0.025));
        float len = 0.3 + 0.18*fract(aDrop.z*13.3);
        p -= dir*len*(1.0-aEnd);
        vec3 L = vec3(0.03,0.035,0.06) + lightAt(p)*0.9;
        vC = L*(1.0-fogF(p));
        vA = aEnd;
        gl_Position = projectionMatrix*viewMatrix*vec4(p,1.0);
      }`,
    fragmentShader:/* glsl */`varying vec3 vC; varying float vA; void main(){ gl_FragColor = vec4(vC*(0.15+0.85*vA)*0.55, 1.0); }`,
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
  const ls=new THREE.LineSegments(g,m); ls.frustumCulled=false; scene.add(ls);
}

function buildGround(){

      void main(){ vUv = textureMatrix*vec4(position,1.0); vec4 wp = modelMatrix*vec4(position,1.0); vW = wp.xyz; gl_Position = projectionMatrix*viewMatrix*wp; }`,

    vertexShader:/* glsl */`varying vec3 vD; void main(){ vD = position; vec4 p = projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_Position = p.xyww; }`,
    fragmentShader:/* glsl */`
      uniform float uTime; varying vec3 vD;
      float hh(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
      float vn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f); return mix(mix(hh(i),hh(i+vec2(1,0)),f.x), mix(hh(i+vec2(0,1)),hh(i+vec2(1,1)),f.x), f.y); }

{ const p0=new THREE.Vector3(), p1=new THREE.Vector3(), tg=new THREE.Vector3(), d0=new THREE.Vector3(), d1=new THREE.Vector3();

  fAcc+=dt; fN++; if (fAcc>0.5){ fpsEl.textContent=(fN/fAcc).toFixed(0)+' fps'; fAcc=0; fN=0; }
}
frame();
</script>
