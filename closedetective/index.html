<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1019">
<title>Close Detective — рабочее пространство расследований</title>
<style>
:root{color-scheme:dark;--bg:#0a0e15;--panel:#111823;--panel2:#161f2d;--line:#263244;--text:#edf2fa;--muted:#8d9bb0;--accent:#e45c68;--accent2:#ff8990;--green:#71d4b0;--amber:#f0c477;--blue:#80b9ff;--radius:16px}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -15%,#22283d 0,transparent 45%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{min-height:100vh}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid #ffffff10;background:#0a0e15d9;backdrop-filter:blur(18px);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:12px;font-weight:850;letter-spacing:.06em}.brand-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:linear-gradient(135deg,#fa7a7f,#9f344d);box-shadow:0 6px 24px #e45c6830;font-size:20px}.brand small{display:block;color:var(--muted);font-weight:500;letter-spacing:.12em;font-size:10px}.top-actions{display:flex;gap:9px;align-items:center}.status{display:flex;align-items:center;gap:7px;color:var(--green);font-size:12px;margin-right:8px}.dot{width:7px;height:7px;background:var(--green);border-radius:50%}.layout{display:grid;grid-template-columns:240px minmax(0,1fr);max-width:1600px;margin:auto;min-height:calc(100vh - 72px)}aside{border-right:1px solid #ffffff10;padding:22px 14px;background:#0c111a80}.side-label{color:#69788d;text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:800;padding:0 12px;margin:12px 0 8px}.nav{display:grid;gap:5px}.nav button{background:transparent;border:1px solid transparent;color:#aab6c7;text-align:left;padding:11px 12px;border-radius:11px;display:flex;gap:12px;align-items:center;transition:.2s}.nav button:hover{background:#ffffff08;color:var(--text)}.nav button.active{background:#e45c6818;border-color:#e45c6838;color:#fff}.nav .ico{width:20px;text-align:center;font-size:16px}.side-bottom{margin-top:28px;padding:14px;border:1px solid var(--line);background:#111823;border-radius:13px;color:var(--muted);font-size:12px}.side-bottom b{color:var(--text);display:block;margin-bottom:5px}.main{padding:28px clamp(16px,3vw,42px) 60px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}.eyebrow{font-size:10px;letter-spacing:.16em;color:var(--accent2);font-weight:800;text-transform:uppercase}.page-head h1{font-size:clamp(26px,3vw,36px);letter-spacing:-.04em;line-height:1.15;margin:5px 0 8px}.page-head p{color:var(--muted);margin:0;max-width:700px}.btn{border:1px solid var(--line);border-radius:11px;padding:10px 14px;background:var(--panel2);color:var(--text);font-weight:650;transition:.2s}.btn:hover{border-color:#52627a;transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,#e45c68,#b84259);border-color:#e45c68;color:white;box-shadow:0 6px 20px #e45c6822}.btn.ghost{background:transparent}.btn.danger{color:#ff9aa0;border-color:#74333b;background:#301a22}.btn.small{padding:6px 9px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:23px}.stat,.panel,.card{border:1px solid var(--line);background:linear-gradient(145deg,#141c28,#101620);border-radius:var(--radius)}.stat{padding:17px 18px}.stat-label{color:var(--muted);font-size:12px}.stat-value{font-size:29px;font-weight:800;letter-spacing:-.04em;margin:3px 0}.stat-note{font-size:11px;color:#718096}.panel{padding:20px;margin-bottom:18px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.panel h2{font-size:16px;margin:0;letter-spacing:-.02em}.panel-sub{font-size:12px;color:var(--muted);margin-top:3px}.search{width:min(320px,100%);background:#0a1019;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);outline:none}.search:focus,input:focus,textarea:focus,select:focus{border-color:#db6571!important;box-shadow:0 0 0 3px #e45c6815}.case-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.case-card{padding:17px;border:1px solid var(--line);border-radius:14px;background:#121a26;cursor:pointer;transition:.2s;min-width:0}.case-card:hover{border-color:#6a4653;transform:translateY(-2px)}.case-card.selected{border-color:var(--accent);box-shadow:inset 0 0 0 1px #e45c6840}.case-top{display:flex;justify-content:space-between;gap:10px}.case-code{color:var(--accent2);font-size:10px;font-weight:850;letter-spacing:.12em}.case-card h3{margin:5px 0 7px;font-size:16px}.case-card p{margin:0;color:var(--muted);font-size:12px;min-height:36px}.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;border:1px solid #455166;background:#222c3a;padding:4px 8px;color:#cbd5e4;font-size:10px;white-space:nowrap}.pill.open{color:#8be0bf;border-color:#285f50;background:#123027}.pill.review{color:#f1cb85;border-color:#6c542c;background:#2c2415}.pill.closed{color:#aab6c7}.case-meta{display:flex;gap:12px;color:#8492a6;font-size:11px;margin-top:14px;padding-top:12px;border-top:1px solid #ffffff0b}.empty{padding:36px 20px;text-align:center;border:1px dashed #344154;border-radius:14px;color:var(--muted)}.empty .empty-ico{font-size:30px;margin-bottom:8px}.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;color:#8290a5;font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:750;padding:10px 12px;border-bottom:1px solid var(--line)}td{padding:13px 12px;border-bottom:1px solid #ffffff0b;color:#d6deea;font-size:12px;vertical-align:top}tr:last-child td{border-bottom:0}.primary-cell{font-weight:700;color:#f2f5fa}.sub-cell{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:3px}.tag-evidence{color:#f0c477}.tag-person{color:#80b9ff}.tag-note{color:#8fe0bd}.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}.detail-title{display:flex;align-items:center;gap:12px}.detail-icon{width:46px;height:46px;border-radius:14px;background:#e45c681a;display:grid;place-items:center;font-size:21px;border:1px solid #e45c6835}.detail-title h2{margin:0;font-size:21px}.detail-title p{margin:3px 0 0;color:var(--muted);font-size:12px}.detail-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px;margin:20px 0}.detail-tabs button{padding:8px 11px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--muted)}.detail-tabs button.active{background:#e45c6817;border-color:#e45c6838;color:white}.detail-content{min-height:120px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-size:12px;color:#aeb9ca;font-weight:650}.field input,.field textarea,.field select{width:100%;background:#0a1019;border:1px solid #2b3749;border-radius:10px;padding:11px 12px;color:var(--text);outline:none}.field textarea{min-height:92px;resize:vertical}.field small{font-size:10px;color:var(--muted)}.modal-backdrop{position:fixed;inset:0;background:#02050bd9;backdrop-filter:blur(7px);z-index:30;display:none;align-items:center;justify-content:center;padding:16px}.modal-backdrop.show{display:flex}.modal{width:min(590px,100%);max-height:90vh;overflow:auto;background:#111925;border:1px solid #354154;border-radius:18px;padding:23px;box-shadow:0 30px 100px #0009}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0;font-size:20px}.close{border:0;background:transparent;color:var(--muted);font-size:23px}.modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.modal-actions div{display:flex;gap:8px}.board{position:relative;min-height:390px;border:1px solid #2b3749;border-radius:14px;overflow:hidden;background-color:#0c121c;background-image:radial-gradient(#3a4658 1px,transparent 1px);background-size:22px 22px}.board-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.board-node{position:absolute;width:160px;padding:12px;background:#192333;border:1px solid #56657b;border-radius:12px;box-shadow:0 8px 25px #0005;cursor:grab;user-select:none}.board-node:active{cursor:grabbing}.board-node small{color:var(--accent2);font-size:9px;letter-spacing:.1em}.board-node b{display:block;margin-top:4px;font-size:12px}.board-node p{font-size:10px;color:var(--muted);margin:4px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.board svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.board line{stroke:#e45c68;stroke-width:2;stroke-dasharray:5 4}.timeline{position:relative;padding-left:23px}.timeline:before{content:"";position:absolute;left:6px;top:8px;bottom:10px;width:1px;background:#394659}.timeline-item{position:relative;padding:0 0 19px 13px}.timeline-item:before{content:"";position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px #e45c6818}.timeline-date{color:var(--accent2);font-size:10px;font-weight:800}.timeline-item h4{margin:3px 0;font-size:13px}.timeline-item p{margin:0;color:var(--muted);font-size:12px}.report{white-space:pre-wrap;background:#0a1019;border:1px solid var(--line);padding:18px;border-radius:12px;color:#d7e0ec;font:12px/1.8 ui-monospace,SFMono-Regular,Consolas,monospace}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#202b39;border:1px solid #46556b;color:#fff;border-radius:12px;padding:11px 16px;z-index:60;transition:.25s;box-shadow:0 12px 40px #0007}.toast.show{opacity:1;transform:translate(-50%,0)}.footer{color:#657389;font-size:11px;text-align:center;margin-top:28px}.mobile-menu{display:none}.hidden{display:none!important}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:sticky;top:72px;z-index:8;border-right:0;border-bottom:1px solid #ffffff10;padding:8px 12px;overflow:auto}.side-label,.side-bottom{display:none}.nav{display:flex;min-width:max-content}.nav button{padding:9px 11px}.main{padding-top:22px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.topbar{height:62px;padding:0 14px}.brand-mark{width:34px;height:34px}.status{display:none}.layout{min-height:calc(100vh - 62px)}aside{top:62px}.main{padding:18px 13px 40px}.page-head{display:block}.page-head>.btn{margin-top:15px;width:100%}.stats{gap:8px}.stat{padding:13px}.stat-value{font-size:25px}.case-grid,.two-col{grid-template-columns:1fr}.panel{padding:14px}.panel-head{align-items:flex-start;flex-wrap:wrap}.search{width:100%}.case-card p{min-height:0}.detail-head .btn{flex:1}.board{min-height:430px}.board-node{width:135px}.modal{padding:17px}.brand{font-size:13px}.brand small{font-size:9px}}
@media print{.topbar,aside,.top-actions,.btn,.detail-tabs,.footer{display:none!important}.layout{display:block}.main{padding:0}.panel,.stat,.case-card{break-inside:avoid;background:white;color:black;border:1px solid #ddd}.report{background:white;color:black}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <a class="brand" href="#" aria-label="Close Detective — главная"><span class="brand-mark">⌕</span><span>CLOSE DETECTIVE<small>INVESTIGATION WORKSPACE</small></span></a>
  <div class="top-actions"><span class="status"><span class="dot"></span>Локальное хранилище</span><button class="btn small ghost" id="exportBtn">⇩ Экспорт данных</button><button class="btn small ghost" id="importBtn">⇧ Импорт</button><input type="file" id="importFile" accept=".json,application/json" hidden></div>
</header>
<div class="layout">
<aside>
  <div class="side-label">Рабочее пространство</div>
  <nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Обзор</button>
    <button data-page="cases"><span class="ico">▣</span>Дела</button>
    <button data-page="evidence"><span class="ico">⌕</span>Улики</button>
    <button data-page="people"><span class="ico">♙</span>Лица</button>
    <button data-page="board"><span class="ico">⌘</span>Доска связей</button>
    <button data-page="timeline"><span class="ico">◷</span>Хронология</button>
    <button data-page="reports"><span class="ico">▤</span>Отчёты</button>
  </nav>
  <div class="side-label">Инструменты</div>
  <nav class="nav"><button id="newCaseSide"><span class="ico">＋</span>Новое дело</button><button id="backupSide"><span class="ico">⇩</span>Резервная копия</button></nav>
  <div class="side-bottom"><b>🔒 Приватность прежде всего</b>Материалы хранятся в браузере на этом устройстве. Ничего не отправляется на сервер.</div>
</aside>
<main class="main" id="main"></main>
</div>
</div>
<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Новое дело</h2><button class="close" id="modalClose" aria-label="Закрыть">×</button></div><form id="modalForm"><div id="modalFields"></div><div class="modal-actions"><button type="button" class="btn ghost" id="modalCancel">Отмена</button><div><button type="submit" class="btn primary">Сохранить</button></div></div></form></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
const STORE='closeDetective.v1';
const uid=()=>Math.random().toString(36).slice(2,8).toUpperCase();
const isoNow=()=>new Date().toISOString();
const dateText=v=>{if(!v)return'—';const d=new Date(v.length===10?v+'T12:00:00':v);return isNaN(d)?v:d.toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'})};
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults=()=>({cases:[{id:'CD-'+uid(),title:'Пример: пропавший документ',type:'Проверка версии',status:'open',priority:'normal',created:isoNow(),updated:isoNow(),description:'Демонстрационное дело. Удалите его или создайте собственное расследование.',notes:'Разделяйте подтверждённые сведения и предположения.',location:'',owner:'',tasks:[]}],evidence:[],people:[],events:[],links:[],selectedCase:null,boardPositions:{}});
let db=load(),page='dashboard',detailTab='overview',modalType='',editId=null,toastTimer;
function load(){try{const raw=localStorage.getItem(STORE);if(raw){const x=JSON.parse(raw);if(x&&Array.isArray(x.cases))return Object.assign(defaults(),x)}}catch(e){}return defaults()}
function save(){try{localStorage.setItem(STORE,JSON.stringify(db));return true}catch(e){notify('Не удалось сохранить. Возможно, хранилище браузера заполнено.');return false}}
function notify(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function activeCase(){return db.cases.find(c=>c.id===db.selectedCase)||db.cases[0]||null}
function caseName(id){return db.cases.find(c=>c.id===id)?.title||'Без дела'}
function statusLabel(s){return ({open:'В работе',review:'На проверке',closed:'Закрыто'})[s]||s}
function pill(s){return '<span class="pill '+escapeHtml(s)+'">'+escapeHtml(statusLabel(s))+'</span>'}
function setPage(p){page=p;document.querySelectorAll('#nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function pageHead(eyebrow,title,desc,buttonText,buttonAction){return '<div class="page-head"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+(buttonText?'<button class="btn primary" data-action="'+buttonAction+'">＋ '+buttonText+'</button>':'')+'</div>'}
function empty(icon,title,desc,action,label){return '<div class="empty"><div class="empty-ico">'+icon+'</div><b>'+title+'</b>'+desc+(action?'<div style="margin-top:15px"><button class="btn primary" data-action="'+action+'">＋ '+label+'</button></div>':'')+'</div>'}
function stats(){return '<div class="stats"><div class="stat"><div class="stat-label">Всего дел</div><div class="stat-value">'+db.cases.length+'</div><div class="stat-note">Ваша база расследований</div></div><div class="stat"><div class="stat-label">Активные дела</div><div class="stat-value">'+db.cases.filter(c=>c.status==='open').length+'</div><div class="stat-note">В работе сейчас</div></div><div class="stat"><div class="stat-label">Материалы</div><div class="stat-value">'+db.evidence.length+'</div><div class="stat-note">Зарегистрированные улики</div></div><div class="stat"><div class="stat-label">Лица</div><div class="stat-value">'+db.people.length+'</div><div class="stat-note">В базе дел</div></div></div>'}
function caseCard(c){return '<article class="case-card '+(c.id===db.selectedCase?'selected':'')+'" data-open-case="'+c.id+'"><div class="case-top"><span class="case-code">'+escapeHtml(c.id)+'</span>'+pill(c.status)+'</div><h3>'+escapeHtml(c.title)+'</h3><p>'+escapeHtml(c.description||'Описание не добавлено')+'</p><div class="case-meta"><span>⌕ '+db.evidence.filter(e=>e.caseId===c.id).length+' улик</span><span>♙ '+db.people.filter(p=>p.caseId===c.id).length+' лиц</span><span>◷ '+dateText(c.updated)+'</span></div></article>'}
function dashboard(){const c=activeCase();return pageHead('РАБОЧЕЕ ПРОСТРАНСТВО','Обзор расследований','Все материалы в одном месте. Фиксируйте факты, проверяйте версии и сохраняйте ход работы.','Создать дело','new-case')+stats()+'<section class="panel"><div class="panel-head"><div><h2>Недавние дела</h2><div class="panel-sub">Выберите дело, чтобы открыть рабочее пространство</div></div><button class="btn small" data-action="go-cases">Все дела →</button></div>'+(db.cases.length?'<div class="case-grid">'+db.cases.slice().sort((a,b)=>new Date(b.updated)-new Date(a.updated)).slice(0,4).map(caseCard).join('')+'</div>':empty('▣','Пока нет дел','Создайте первое дело, чтобы начать.','new-case','Создать дело'))+'</section><section class="panel"><div class="panel-head"><div><h2>Быстрый доступ</h2><div class="panel-sub">Материалы выбранного дела</div></div><span class="pill">'+(c?escapeHtml(c.id):'Нет выбранного дела')+'</span></div>'+(c?'<div class="two-col"><div class="case-card" data-action="go-evidence"><span class="tag-evidence">⌕ УЛИКИ</span><h3>'+db.evidence.filter(e=>e.caseId===c.id).length+' материалов</h3><p>Регистрация предметов, документов, фото и наблюдений.</p></div><div class="case-card" data-action="go-people"><span class="tag-person">♙ ЛИЦА</span><h3>'+db.people.filter(p=>p.caseId===c.id).length+' профилей</h3><p>Свидетели, заявители и другие лица по делу.</p></div><div class="case-card" data-action="go-board"><span class="tag-note">⌘ СВЯЗИ</span><h3>Доска расследования</h3><p>Размещайте карточки и фиксируйте связи между материалами.</p></div><div class="case-card" data-action="go-timeline"><span class="tag-note">◷ ХРОНОЛОГИЯ</span><h3>'+db.events.filter(e=>e.caseId===c.id).length+' событий</h3><p>Собирайте последовательность событий с датами и временем.</p></div></div>':'<p class="panel-sub">Создайте дело, чтобы получить быстрый доступ к материалам.</p>')+'</section><div class="footer">CLOSE DETECTIVE · Локальное рабочее пространство · Версия 1.0</div>'}
function casesPage(){return pageHead('РЕЕСТР','Дела','Создавайте отдельные рабочие пространства для каждого расследования.','Новое дело','new-case')+'<section class="panel"><div class="panel-head"><div><h2>Реестр дел</h2><div class="panel-sub">'+db.cases.length+' записей</div></div><input class="search" id="caseSearch" placeholder="Поиск по названию и номеру…"></div><div class="case-grid" id="caseGrid">'+(db.cases.length?db.cases.map(caseCard).join(''):empty('▣','Реестр пуст','Добавьте первое дело.','new-case','Создать дело'))+'</div></section>'}
function selectedEvidence(){const c=activeCase();return db.evidence.filter(e=>!c||e.caseId===c.id)}
function evidencePage(){const c=activeCase();return pageHead('МАТЕРИАЛЫ','Улики и материалы','Фиксируйте источник, дату, описание и статус проверки каждого материала.','Добавить улику','new-evidence')+'<section class="panel"><div class="panel-head"><div><h2>'+(c?escapeHtml(c.title):'Все материалы')+'</h2><div class="panel-sub">Фиксация не подтверждает достоверность материала автоматически.</div></div><input class="search" id="evidenceSearch" placeholder="Найти улику…"></div><div class="table-wrap"><table><thead><tr><th>Материал</th><th>Тип / дата</th><th>Источник</th><th>Статус</th><th>Действия</th></tr></thead><tbody id="evidenceRows">'+evidenceRows(selectedEvidence())+'</tbody></table></div></section>'}
function evidenceRows(rows){return rows.length?rows.map(e=>'<tr><td><span class="primary-cell">'+escapeHtml(e.title)+'</span><span class="sub-cell">'+escapeHtml(e.description||'Без описания')+'</span><span class="sub-cell">'+escapeHtml(caseName(e.caseId))+'</span></td><td>'+escapeHtml(e.type)+'<span class="sub-cell">'+dateText(e.date)+'</span></td><td>'+escapeHtml(e.source||'Не указан')+'</td><td><span class="pill '+(e.status==='verified'?'open':e.status==='review'?'review':'')+'">'+({verified:'Проверено',review:'На проверке',unverified:'Не проверено'})[e.status]+'</span></td><td><button class="btn small" data-edit="evidence" data-id="'+e.id+'">Изменить</button> <button class="btn small danger" data-delete="evidence" data-id="'+e.id+'">Удалить</button></td></tr>').join(''):'<tr><td colspan="5">'+empty('⌕','Материалов пока нет','Добавьте первую улику, связанную с выбранным делом.','new-evidence','Добавить улику')+'</td></tr>'}
function peoplePage(){const c=activeCase(),rows=db.people.filter(p=>!c||p.caseId===c.id);return pageHead('КАРТОТЕКА','Лица по делу','Храните отдельные карточки людей и привязывайте к ним показания и материалы.','Добавить лицо','new-person')+'<section class="panel"><div class="panel-head"><div><h2>'+(c?escapeHtml(c.title):'Все лица')+'</h2><div class="panel-sub">'+rows.length+' профилей</div></div><input class="search" id="peopleSearch" placeholder="Поиск по имени…"></div><div class="table-wrap"><table><thead><tr><th>Имя</th><th>Роль</th><th>Контакт / приметы</th><th>Заметки</th><th>Действия</th></tr></thead><tbody id="peopleRows">'+peopleRows(rows)+'</tbody></table></div></section>'}
function peopleRows(rows){return rows.length?rows.map(p=>'<tr><td><span class="primary-cell">'+escapeHtml(p.name)+'</span><span class="sub-cell">'+escapeHtml(caseName(p.caseId))+'</span></td><td><span class="pill">'+escapeHtml(p.role)+'</span></td><td>'+escapeHtml(p.contact||'Не указано')+'</td><td>'+escapeHtml(p.notes||'—')+'</td><td><button class="btn small" data-edit="person" data-id="'+p.id+'">Изменить</button> <button class="btn small danger" data-delete="people" data-id="'+p.id+'">Удалить</button></td></tr>').join(''):'<tr><td colspan="5">'+empty('♙','Профилей пока нет','Добавьте лицо и зафиксируйте только необходимые сведения.','new-person','Добавить лицо')+'</td></tr>'}
function boardPage(){const c=activeCase();if(!c)return pageHead('СХЕМА','Доска связей','Выберите или создайте дело.','','')+empty('⌘','Нет активного дела','Сначала создайте дело.','new-case','Создать дело');const ev=db.evidence.filter(e=>e.caseId===c.id),pp=db.people.filter(p=>p.caseId===c.id);const nodes=[...ev.map(e=>({id:e.id,title:e.title,kind:'УЛИКА',desc:e.type})),...pp.map(p=>({id:p.id,title:p.name,kind:'ЛИЦО',desc:p.role}))];const positions=db.boardPositions[c.id]||{};return pageHead('АНАЛИТИЧЕСКАЯ ДОСКА','Связи и версии','Перетаскивайте карточки, добавляйте связи между материалами. Линии обозначают гипотезы, а не доказанные факты.','Добавить связь','new-link')+'<section class="panel"><div class="panel-head"><div><h2>'+escapeHtml(c.title)+'</h2><div class="panel-sub">Улик: '+ev.length+' · Лиц: '+pp.length+' · Связей: '+db.links.filter(l=>l.caseId===c.id).length+'</div></div><button class="btn small" data-action="auto-layout">Расположить карточки</button></div><div class="board-tools"><span class="pill">Перетаскивайте карточки мышью или пальцем</span><span class="pill">Линии — рабочие гипотезы</span></div><div class="board" id="board"><svg id="boardSvg" aria-hidden="true"></svg>'+nodes.map((n,i)=>{const p=positions[n.id]||{x:18+(i%3)*185,y:18+Math.floor(i/3)*120};return '<div class="board-node" draggable="true" data-node="'+n.id+'" style="left:'+p.x+'px;top:'+p.y+'px"><small>'+n.kind+'</small><b>'+escapeHtml(n.title)+'</b><p>'+escapeHtml(n.desc||'')+'</p></div>'}).join('')+'</div>'+(nodes.length?'':'<div style="margin-top:14px">'+empty('⌘','Нет карточек для доски','Добавьте улики или людей, чтобы они появились здесь.','','')+'</div>')+'</section><section class="panel"><div class="panel-head"><div><h2>Зафиксированные связи</h2><div class="panel-sub">Указывайте основание и степень уверенности</div></div></div>'+(db.links.filter(l=>l.caseId===c.id).length?'<div class="table-wrap"><table><thead><tr><th>Между</th><th>Описание связи</th><th>Уверенность</th><th></th></tr></thead><tbody>'+db.links.filter(l=>l.caseId===c.id).map(l=>'<tr><td>'+escapeHtml(nodeName(l.from))+' ↔ '+escapeHtml(nodeName(l.to))+'</td><td>'+escapeHtml(l.description)+'</td><td><span class="pill review">'+escapeHtml(l.confidence)+'</span></td><td><button class="btn small danger" data-delete="links" data-id="'+l.id+'">Удалить</button></td></tr>').join('')+'</tbody></table></div>': '<p class="panel-sub">Связи пока не добавлены.</p>')+'</section>'}
function nodeName(id){return db.evidence.find(e=>e.id===id)?.title||db.people.find(p=>p.id===id)?.name||'Удалённая запись'}
function drawLines(){const board=document.getElementById('board'),svg=document.getElementById('boardSvg');if(!board||!svg)return;svg.innerHTML='';const rect=board.getBoundingClientRect();svg.setAttribute('viewBox','0 0 '+board.clientWidth+' '+board.clientHeight);const c=activeCase();if(!c)return;db.links.filter(l=>l.caseId===c.id).forEach(l=>{const a=board.querySelector('[data-node="'+l.from+'"]'),b=board.querySelector('[data-node="'+l.to+'"]');if(!a||!b)return;const x1=a.offsetLeft+a.offsetWidth/2,y1=a.offsetTop+a.offsetHeight/2,x2=b.offsetLeft+b.offsetWidth/2,y2=b.offsetTop+b.offsetHeight/2;const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',x1);line.setAttribute('y1',y1);line.setAttribute('x2',x2);line.setAttribute('y2',y2);svg.appendChild(line)})}
function timelinePage(){const c=activeCase(),rows=db.events.filter(e=>!c||e.caseId===c.id).sort((a,b)=>(a.date||'').localeCompare(b.date||''));return pageHead('ПОСЛЕДОВАТЕЛЬНОСТЬ','Хронология событий','Соберите последовательность фактов. Отмечайте источник и различайте время события и время получения сведений.','Добавить событие','new-event')+'<section class="panel"><div class="panel-head"><div><h2>'+(c?escapeHtml(c.title):'Все события')+'</h2><div class="panel-sub">'+rows.length+' событий в хронологии</div></div></div>'+(rows.length?'<div class="timeline">'+rows.map(e=>'<div class="timeline-item"><div class="timeline-date">'+dateText(e.date)+(e.time?' · '+escapeHtml(e.time):'')+'</div><h4>'+escapeHtml(e.title)+'</h4><p>'+escapeHtml(e.description||'Описание не добавлено')+'</p><div class="sub-cell">Источник: '+escapeHtml(e.source||'Не указан')+' · '+escapeHtml(caseName(e.caseId))+'</div><div style="margin-top:7px"><button class="btn small" data-edit="event" data-id="'+e.id+'">Изменить</button> <button class="btn small danger" data-delete="events" data-id="'+e.id+'">Удалить</button></div></div>').join('')+'</div>':empty('◷','Хронология пуста','Добавьте событие с датой, временем и источником.','new-event','Добавить событие'))+'</section>'}
function reportsPage(){const c=activeCase();if(!c)return pageHead('ДОКУМЕНТЫ','Отчёты','Сформируйте сводку по делу.','','')+empty('▤','Нет дела','Создайте дело, чтобы подготовить отчёт.','new-case','Создать дело');const ev=db.evidence.filter(e=>e.caseId===c.id),pp=db.people.filter(p=>p.caseId===c.id),events=db.events.filter(e=>e.caseId===c.id).sort((a,b)=>(a.date||'').localeCompare(b.date||'')),links=db.links.filter(l=>l.caseId===c.id);const text='CLOSE DETECTIVE — СВОДКА ПО ДЕЛУ\n'+'='.repeat(42)+'\nНомер: '+c.id+'\nНазвание: '+c.title+'\nСтатус: '+statusLabel(c.status)+'\nПриоритет: '+c.priority+'\nСоздано: '+dateText(c.created)+'\nОбновлено: '+dateText(c.updated)+'\n\nОПИСАНИЕ\n'+(c.description||'Не указано')+'\n\nРАБОЧИЕ ЗАМЕТКИ\n'+(c.notes||'Не указаны')+'\n\nУЛИКИ И МАТЕРИАЛЫ ('+ev.length+')\n'+(ev.map((e,i)=>(i+1)+'. '+e.title+' ['+e.type+'] — '+(e.description||'без описания')+'; источник: '+(e.source||'не указан')+'; статус: '+e.status).join('\n')||'Нет записей')+'\n\nЛИЦА ('+pp.length+')\n'+(pp.map((p,i)=>(i+1)+'. '+p.name+' — '+p.role+'; заметки: '+(p.notes||'нет')).join('\n')||'Нет записей')+'\n\nХРОНОЛОГИЯ ('+events.length+')\n'+(events.map((e,i)=>(i+1)+'. '+dateText(e.date)+' '+(e.time||'')+' — '+e.title+': '+(e.description||'')+'; источник: '+(e.source||'не указан')).join('\n')||'Нет записей')+'\n\nЗАФИКСИРОВАННЫЕ СВЯЗИ ('+links.length+')\n'+(links.map((l,i)=>(i+1)+'. '+nodeName(l.from)+' ↔ '+nodeName(l.to)+' — '+l.description+'; уверенность: '+l.confidence).join('\n')||'Нет записей')+'\n\nПРИМЕЧАНИЕ\nЭтот документ — рабочая сводка, сформированная из внесённых пользователем данных. Он не подтверждает достоверность сведений и не является официальным процессуальным документом.\nСформировано: '+new Date().toLocaleString('ru-RU');return pageHead('ДОКУМЕНТЫ','Отчёты по делу','Подготовьте сводку, скопируйте её или сохраните как текстовый файл.','Скачать TXT','download-report')+'<section class="panel"><div class="panel-head"><div><h2>'+escapeHtml(c.title)+'</h2><div class="panel-sub">Автоматически собранная сводка из текущих записей</div></div><button class="btn" data-action="copy-report">Копировать</button></div><div class="report" id="reportText">'+escapeHtml(text)+'</div><p class="panel-sub" style="margin-top:12px">Перед передачей документа проверьте факты, даты и допустимость раскрытия персональных данных.</p></section>'}
function render(){const main=document.getElementById('main');const pages={dashboard,cases:casesPage,evidence:evidencePage,people:peoplePage,board:boardPage,timeline:timelinePage,reports:reportsPage};main.innerHTML=(pages[page]||dashboard)();if(page==='board'){setTimeout(()=>{drawLines();enableDrag()},20)}}
function fields(type,item={}){const c=activeCase();const caseOptions=db.cases.map(x=>'<option value="'+escapeHtml(x.id)+'" '+((item.caseId||c?.id)===x.id?'selected':'')+'>'+escapeHtml(x.id+' · '+x.title)+'</option>').join('');const field=(name,label,value,kind='text',extra='')=>'<div class="field"><label for="f_'+name+'">'+label+'</label><input id="f_'+name+'" name="'+name+'" type="'+kind+'" value="'+escapeHtml(value||'')+'" '+extra+'></div>';const area=(name,label,value,placeholder='')=>'<div class="field"><label for="f_'+name+'">'+label+'</label><textarea id="f_'+name+'" name="'+name+'" placeholder="'+placeholder+'">'+escapeHtml(value||'')+'</textarea></div>';const select=(name,label,opts,value)=>'<div class="field"><label for="f_'+name+'">'+label+'</label><select id="f_'+name+'" name="'+name+'">'+opts.map(o=>'<option value="'+o[0]+'" '+(o[0]===value?'selected':'')+'>'+o[1]+'</option>').join('')+'</select></div>';let html='';if(type==='case'){html=field('title','Название дела *',item.title,'text','required maxlength="120"')+ '<div class="two-col">'+select('status','Статус',[['open','В работе'],['review','На проверке'],['closed','Закрыто']],item.status||'open')+select('priority','Приоритет',[['normal','Обычный'],['high','Высокий'],['urgent','Срочный']],item.priority||'normal')+'</div>'+field('location','Место / регион',item.location)+field('owner','Ответственный',item.owner)+area('description','Описание дела',item.description)+area('notes','Рабочие заметки',item.notes,'Отделяйте факты от предположений…')}else if(type==='evidence'){html=select('caseId','Дело *',db.cases.map(x=>[x.id,x.id+' · '+x.title]),item.caseId||c?.id)+field('title','Название материала *',item.title,'text','required maxlength="140"')+'<div class="two-col">'+select('type','Тип материала',[['Документ','Документ'],['Фото','Фото'],['Предмет','Предмет'],['Цифровые данные','Цифровые данные'],['Показание','Показание'],['Наблюдение','Наблюдение'],['Другое','Другое']],item.type||'Документ')+select('status','Статус проверки',[['unverified','Не проверено'],['review','На проверке'],['verified','Проверено']],item.status||'unverified')+'</div>'+field('date','Дата обнаружения',item.date||new Date().toISOString().slice(0,10),'date')+field('source','Источник / кем получено',item.source)+area('description','Описание материала',item.description)+ '<div class="field"><label for="f_file">Прикрепить файл (необязательно)</label><input id="f_file" name="file" type="file" accept="image/*,.pdf,.txt,.doc,.docx,.csv" /><small>Файл хранится в браузере только если помещается в локальное хранилище. Для больших файлов храните оригинал отдельно и укажите путь/место хранения в описании.</small></div>'}else if(type==='person'){html=select('caseId','Дело *',db.cases.map(x=>[x.id,x.id+' · '+x.title]),item.caseId||c?.id)+field('name','Имя / обозначение *',item.name,'text','required maxlength="120"')+select('role','Роль',[['Свидетель','Свидетель'],['Заявитель','Заявитель'],['Потерпевший','Потерпевший'],['Подозреваемый','Подозреваемый'],['Контакт','Контакт'],['Другое','Другое']],item.role||'Свидетель')+field('contact','Контакт / приметы',item.contact)+area('notes','Заметки и источник сведений',item.notes,'Указывайте только необходимую информацию…')}else if(type==='event'){html=select('caseId','Дело *',db.cases.map(x=>[x.id,x.id+' · '+x.title]),item.caseId||c?.id)+field('title','Название события *',item.title,'text','required maxlength="140"')+'<div class="two-col">'+field('date','Дата события *',item.date||new Date().toISOString().slice(0,10),'date','required')+field('time','Время',item.time,'time')+'</div>'+field('source','Источник сведений',item.source)+area('description','Описание события',item.description)}else if(type==='link'){const opts=[];db.evidence.filter(x=>x.caseId===c?.id).forEach(x=>opts.push([x.id,'Улика · '+x.title]));db.people.filter(x=>x.caseId===c?.id).forEach(x=>opts.push([x.id,'Лицо · '+x.name]));html='<div class="field"><label>Первая карточка *</label><select name="from" required>'+opts.map(o=>'<option value="'+escapeHtml(o[0])+'" '+(o[0]===item.from?'selected':'')+'>'+escapeHtml(o[1])+'</option>').join('')+'</select></div><div class="field"><label>Вторая карточка *</label><select name="to" required>'+opts.filter(o=>o[0]!==item.from).map(o=>'<option value="'+escapeHtml(o[0])+'" '+(o[0]===item.to?'selected':'')+'>'+escapeHtml(o[1])+'</option>').join('')+'</select></div>'+area('description','Основание / описание связи',item.description,'Почему эти материалы могут быть связаны?')+select('confidence','Уверенность',[['Гипотеза','Гипотеза'],['Есть косвенные сведения','Есть косвенные сведения'],['Подтверждена источником','Подтверждена источником'],['Неизвестно','Неизвестно']],item.confidence||'Гипотеза')+'<small>Связь не является доказательством вины или подтверждением версии.</small>'}return html}
function openModal(type,id){modalType=type;editId=id||null;const map={case:'дело',evidence:'улику',person:'лицо',event:'событие',link:'связь'};const collection={case:'cases',evidence:'evidence',person:'people',event:'events',link:'links'}[type];const item=id?db[collection].find(x=>x.id===id)||{}:{};document.getElementById('modalTitle').textContent=(id?'Изменить: ':'Новое ')+(map[type]||'');document.getElementById('modalFields').innerHTML=fields(type,item);document.getElementById('modalBackdrop').classList.add('show');setTimeout(()=>document.querySelector('#modalFields input:not([type=file]),#modalFields textarea')?.focus(),50)}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('show');document.getElementById('modalForm').reset();modalType='';editId=null}
function formObject(form){const fd=new FormData(form),o={};for(const [k,v] of fd.entries()){if(k==='file')continue;o[k]=String(v).trim()}return o}
document.getElementById('modalForm').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,vals=formObject(f);const collection={case:'cases',evidence:'evidence',person:'people',event:'events',link:'links'}[modalType];if(!collection)return;if(modalType==='case'){if(editId){const old=db.cases.find(x=>x.id===editId);Object.assign(old,vals,{updated:isoNow()})}else{const x=Object.assign({id:'CD-'+uid(),created:isoNow(),updated:isoNow(),tasks:[]},vals);db.cases.unshift(x);db.selectedCase=x.id}}else if(modalType==='evidence'){const file=f.elements.file?.files?.[0];let attachment=null;if(file){if(file.size>350000){notify('Файл больше 350 КБ. Сохраните оригинал отдельно и укажите его расположение в описании.');}else{attachment={name:file.name,type:file.type,size:file.size,data:await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>resolve(null);r.readAsDataURL(file)})}}}if(editId){const old=db.evidence.find(x=>x.id===editId);Object.assign(old,vals,{updated:isoNow()});if(attachment)old.attachment=attachment}else db.evidence.unshift(Object.assign({id:'EV-'+uid(),created:isoNow(),attachment},vals))}else if(modalType==='person'){if(editId)Object.assign(db.people.find(x=>x.id===editId),vals,{updated:isoNow()});else db.people.unshift(Object.assign({id:'PS-'+uid(),created:isoNow()},vals))}else if(modalType==='event'){if(editId)Object.assign(db.events.find(x=>x.id===editId),vals,{updated:isoNow()});else db.events.push(Object.assign({id:'EVT-'+uid(),created:isoNow()},vals))}else if(modalType==='link'){if(vals.from===vals.to){notify('Выберите две разные карточки.');return}if(editId)Object.assign(db.links.find(x=>x.id===editId),vals);else db.links.push(Object.assign({id:'LK-'+uid(),caseId:activeCase()?.id},vals))}const c=activeCase();if(c)c.updated=isoNow();save();closeModal();render();notify('Изменения сохранены на этом устройстве.');});
function removeItem(type,id){const names={evidence:'улику',people:'карточку лица',events:'событие',links:'связь',cases:'дело'};if(!confirm('Удалить '+(names[type]||'запись')+'? Это действие нельзя отменить.'))return;db[type]=db[type].filter(x=>x.id!==id);if(type==='cases'&&db.selectedCase===id)db.selectedCase=db.cases[0]?.id||null;if(type==='evidence'||type==='people'){db.links=db.links.filter(l=>l.from!==id&&l.to!==id)}save();render();notify('Запись удалена.')}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});downloadBlob(blob,'close-detective-backup-'+new Date().toISOString().slice(0,10)+'.json');notify('Резервная копия подготовлена.')}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function downloadReport(){const text=document.getElementById('reportText')?.textContent||'';downloadBlob(new Blob([text],{type:'text/plain;charset=utf-8'}),'close-detective-report-'+(activeCase()?.id||'case')+'.txt')}
function importData(file){const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(reader.result);if(!incoming||!Array.isArray(incoming.cases)||!Array.isArray(incoming.evidence)||!Array.isArray(incoming.people))throw new Error('format');if(!confirm('Импорт заменит текущие данные. Сначала скачайте резервную копию, если она нужна. Продолжить?'))return;db=Object.assign(defaults(),incoming);save();render();notify('Данные импортированы.')}catch(e){notify('Не удалось импортировать файл. Проверьте JSON-резервную копию.')}};reader.readAsText(file)}
function enableDrag(){const board=document.getElementById('board');if(!board)return;let dragging=null,offset={x:0,y:0};board.querySelectorAll('.board-node').forEach(node=>{node.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;dragging=node;const r=node.getBoundingClientRect();offset={x:e.clientX-r.left,y:e.clientY-r.top};node.setPointerCapture?.(e.pointerId);node.style.zIndex='3'});node.addEventListener('pointermove',e=>{if(dragging!==node)return;const r=board.getBoundingClientRect();let x=Math.max(0,Math.min(board.clientWidth-node.offsetWidth,e.clientX-r.left-offset.x)),y=Math.max(0,Math.min(board.clientHeight-node.offsetHeight,e.clientY-r.top-offset.y));node.style.left=x+'px';node.style.top=y+'px';drawLines()});node.addEventListener('pointerup',()=>{if(dragging!==node)return;dragging=null;node.style.zIndex='';const c=activeCase();if(!c)return;db.boardPositions[c.id]=db.boardPositions[c.id]||{};db.boardPositions[c.id][node.dataset.node]={x:node.offsetLeft,y:node.offsetTop};save()})})}
function autoLayout(){const board=document.getElementById('board');if(!board)return;const nodes=[...board.querySelectorAll('.board-node')];const cols=Math.max(1,Math.floor((board.clientWidth-30)/180));nodes.forEach((n,i)=>{const x=15+(i%cols)*180,y=15+Math.floor(i/cols)*125;n.style.left=x+'px';n.style.top=y+'px';const c=activeCase();db.boardPositions[c.id]=db.boardPositions[c.id]||{};db.boardPositions[c.id][n.dataset.node]={x,y}});board.style.minHeight=Math.max(390,30+Math.ceil(nodes.length/cols)*125)+'px';save();drawLines()}
document.body.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){setPage(nav.dataset.page);return}const open=e.target.closest('[data-open-case]');if(open){db.selectedCase=open.dataset.openCase;save();setPage('cases');return}const action=e.target.closest('[data-action]')?.dataset.action;if(action){if(action==='new-case')openModal('case');else if(action==='new-evidence')db.cases.length?openModal('evidence'):notify('Сначала создайте дело.');else if(action==='new-person')db.cases.length?openModal('person'):notify('Сначала создайте дело.');else if(action==='new-event')db.cases.length?openModal('event'):notify('Сначала создайте дело.');else if(action==='new-link')db.cases.length?openModal('link'):notify('Сначала создайте дело.');else if(action==='go-cases')setPage('cases');else if(action==='go-evidence')setPage('evidence');else if(action==='go-people')setPage('people');else if(action==='go-board')setPage('board');else if(action==='go-timeline')setPage('timeline');else if(action==='download-report')downloadReport();else if(action==='copy-report'){const t=document.getElementById('reportText')?.textContent||'';if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>notify('Отчёт скопирован.')).catch(()=>notify('Не удалось скопировать. Используйте скачивание TXT.'));else notify('Скачайте отчёт в формате TXT.')}else if(action==='auto-layout')autoLayout();return}const edit=e.target.closest('[data-edit]');if(edit){openModal(edit.dataset.edit,edit.dataset.id);return}const del=e.target.closest('[data-delete]');if(del){removeItem(del.dataset.delete,del.dataset.id);return}});
document.getElementById('modalClose').onclick=closeModal;document.getElementById('modalCancel').onclick=closeModal;document.getElementById('modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.getElementById('exportBtn').onclick=exportData;document.getElementById('backupSide').onclick=exportData;document.getElementById('newCaseSide').onclick=()=>openModal('case');document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=''};
document.getElementById('main').addEventListener('input',e=>{const q=e.target.value.toLowerCase();if(e.target.id==='caseSearch'){const list=db.cases.filter(c=>(c.title+' '+c.id+' '+c.description).toLowerCase().includes(q));document.getElementById('caseGrid').innerHTML=list.length?list.map(caseCard).join(''):empty('⌕','Ничего не найдено','Измените поисковый запрос.','','')}if(e.target.id==='evidenceSearch'){const rows=selectedEvidence().filter(x=>(x.title+' '+x.description+' '+x.source+' '+x.type).toLowerCase().includes(q));document.getElementById('evidenceRows').innerHTML=evidenceRows(rows)}if(e.target.id==='peopleSearch'){const c=activeCase(),rows=db.people.filter(p=>(!c||p.caseId===c.id)&&(p.name+' '+p.role+' '+p.notes).toLowerCase().includes(q));document.getElementById('peopleRows').innerHTML=peopleRows(rows)}});
if(!db.selectedCase&&db.cases[0])db.selectedCase=db.cases[0].id;save();render();
})();
</script>
</body>
</html>
