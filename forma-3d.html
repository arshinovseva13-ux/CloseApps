<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17191f"><title>Pixel Studio — редактор изображений</title>
<style>
:root{--bg:#17191f;--panel:#22252d;--panel2:#2c303a;--line:#3a3f4b;--text:#f1f2f5;--muted:#a7adba;--accent:#a78bfa;--accent2:#7c5ce0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Inter,system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;overflow:hidden}button,input,select{font:inherit}button{color:inherit;cursor:pointer}.app{height:100dvh;display:grid;grid-template-rows:56px 1fr}.top{display:flex;align-items:center;gap:12px;padding:0 16px;background:#20232a;border-bottom:1px solid var(--line)}.logo{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#c4b5fd,#8b5cf6);font-size:21px;color:#211735;font-weight:900}.brand{font-weight:850;font-size:16px;white-space:nowrap}.brand span{color:#b8a4ff}.sub{font-size:11px;color:var(--muted);font-weight:500}.top-actions{margin-left:auto;display:flex;gap:7px}.btn{border:1px solid #484d59;background:#30343e;border-radius:8px;padding:9px 12px}.btn:hover{filter:brightness(1.12)}.btn.primary{background:var(--accent2);border-color:var(--accent2);font-weight:750}.main{min-height:0;display:grid;grid-template-columns:58px minmax(0,1fr) 275px}.tools{background:#20232a;border-right:1px solid var(--line);display:flex;align-items:center;flex-direction:column;padding:10px 7px;gap:7px;overflow:auto}.tool{width:42px;height:42px;flex:0 0 42px;border:1px solid transparent;border-radius:9px;background:transparent;font-size:20px}.tool.active,.tool:hover{background:#383345;border-color:#8068c7;box-shadow:inset 3px 0 var(--accent)}.sep{width:28px;height:1px;background:var(--line);margin:4px 0}.stage{position:relative;min-width:0;min-height:0;display:flex;flex-direction:column;background:#30333b}.stagebar{height:43px;flex:0 0 43px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid #454954;background:#292c34;color:#c8ccd5}.stagebar strong{color:white}.stagebar .spacer{flex:1}.stagebar button{padding:5px 8px}.board{position:relative;flex:1;min-height:0;overflow:hidden;display:grid;place-items:center;background-color:#343741;background-image:linear-gradient(45deg,#3d404a 25%,transparent 25%),linear-gradient(-45deg,#3d404a 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#3d404a 75%),linear-gradient(-45deg,transparent 75%,#3d404a 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}.canvas-wrap{position:relative;box-shadow:0 8px 36px #0008;max-width:100%;max-height:100%;line-height:0}.canvas-wrap canvas{display:block;max-width:100%;max-height:100%;touch-action:none}.empty-start{position:absolute;z-index:1;text-align:center;padding:24px;max-width:340px;background:#20232ae8;border:1px solid #555968;border-radius:16px;box-shadow:0 12px 40px #0005}.empty-start .big{font-size:42px}.empty-start h2{margin:8px 0}.empty-start p{color:#b8bdc8;margin:0 0 15px}.hint{position:absolute;bottom:10px;left:10px;background:#1e2028d9;border:1px solid #555966;border-radius:8px;padding:6px 9px;color:#c1c5cf;font-size:11px;pointer-events:none}.side{background:#22252d;border-left:1px solid var(--line);min-width:0;overflow:auto}.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:#22252d;z-index:2}.tab{flex:1;border:0;border-bottom:2px solid transparent;background:transparent;padding:13px 4px;color:var(--muted)}.tab.active{color:white;border-bottom-color:var(--accent)}.section{padding:13px;border-bottom:1px solid var(--line)}.section h3{font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:#c5c9d2;margin:0 0 12px}.field{display:grid;grid-template-columns:85px minmax(0,1fr);gap:8px;align-items:center;margin:10px 0}.field label{font-size:12px;color:#b7bdc8}.field input:not([type=color]):not([type=range]),.field select,.field textarea{width:100%;min-width:0;background:#17191f;border:1px solid #444956;border-radius:6px;padding:8px;color:white}.field input[type=color]{width:100%;height:35px;border:1px solid #454a57;border-radius:6px;background:#17191f;padding:3px}.field input[type=range]{width:100%;accent-color:var(--accent)}.rowbtns{display:flex;gap:6px;flex-wrap:wrap}.rowbtns .btn{flex:1;padding:7px 8px}.layers{display:grid;gap:5px}.layer{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid transparent;background:#2c3039;border-radius:7px;cursor:pointer}.layer.active{border-color:#a78bfa;background:#3b354d}.layer-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.layer small{color:var(--muted)}.layer button{border:0;background:transparent;padding:3px}.empty-note{color:#9fa6b3;font-size:12px;line-height:1.6}.color-swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.swatch{height:25px;border:1px solid #ffffff2b;border-radius:6px}.hidden{display:none!important}.toast{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#17191fee;border:1px solid #626878;padding:9px 14px;border-radius:8px;z-index:10;opacity:0;pointer-events:none;transition:opacity .2s}.toast.show{opacity:1}.mobile-panel{display:none}
@media(max-width:900px){.main{grid-template-columns:50px minmax(0,1fr)}.side{display:none;position:absolute;z-index:5;right:0;top:56px;bottom:0;width:min(340px,88vw);box-shadow:-10px 0 30px #0008}.side.open{display:block}.tool{width:36px;height:38px;flex-basis:38px}.top{padding:0 9px;gap:8px}.sub{display:none}.top-actions .optional{display:none}}
@media(max-width:560px){.app{grid-template-rows:50px 1fr}.top{height:50px}.logo{width:30px;height:30px}.brand{font-size:13px}.top-actions{gap:4px}.top-actions .btn{padding:7px 8px;font-size:11px}.top-actions #saveBtn{font-size:0;width:37px}.top-actions #saveBtn:after{content:'PNG ↓';font-size:11px}.top-actions #openBtn{font-size:0;width:37px}.top-actions #openBtn:after{content:'＋';font-size:19px}.main{grid-template-columns:43px minmax(0,1fr)}.tools{padding:7px 4px;gap:5px}.tool{width:33px;height:36px;flex-basis:36px;font-size:17px}.stagebar{height:38px;flex-basis:38px;padding:0 7px;font-size:11px}.stagebar .wide{display:none}.side{top:50px;width:calc(100vw - 43px)}.section{padding:11px}.field{grid-template-columns:75px minmax(0,1fr)}.hint{font-size:9px;bottom:5px;left:5px}.empty-start{width:calc(100% - 24px);padding:17px}.empty-start h2{font-size:19px}}
</style></head><body><div class="app">
<header class="top"><div class="logo">P</div><div><div class="brand">PIXEL <span>STUDIO</span></div><div class="sub">Редактор изображений · проект в браузере</div></div><div class="top-actions"><button class="btn optional" id="newBtn">Новый</button><button class="btn" id="openBtn">Импорт</button><button class="btn primary" id="saveBtn">Экспорт PNG</button><button class="btn" id="panelBtn">☷</button></div></header>
<div class="main"><aside class="tools" aria-label="Инструменты">
<button class="tool active" data-tool="brush" title="Кисть (B)">🖌</button><button class="tool" data-tool="eraser" title="Ластик (E)">◩</button><button class="tool" data-tool="line" title="Линия (L)">／</button><button class="tool" data-tool="rect" title="Прямоугольник (U)">▱</button><button class="tool" data-tool="ellipse" title="Эллипс (O)">◯</button><button class="tool" data-tool="text" title="Текст (T)">T</button><div class="sep"></div><button class="tool" id="undoBtn" title="Отменить">↶</button><button class="tool" id="redoBtn" title="Повторить">↷</button><button class="tool" id="clearBtn" title="Очистить слой">⌫</button>
</aside><main class="stage"><div class="stagebar"><strong id="docName">Без названия</strong><span id="dimensions">1200 × 800</span><span class="spacer"></span><button class="btn" id="zoomOut">−</button><span id="zoomLabel">100%</span><button class="btn" id="zoomIn">＋</button><button class="btn wide" id="fitBtn">Вписать</button></div><div class="board" id="board"><div class="canvas-wrap" id="canvasWrap"><canvas id="art" width="1200" height="800"></canvas></div><div class="empty-start" id="welcome"><div class="big">🎨</div><h2>Создай своё изображение</h2><p>Рисуй, добавляй текст и фигуры, импортируй картинки и сохраняй результат в PNG.</p><button class="btn primary" id="startBtn">Начать рисовать</button><button class="btn" id="welcomeImport">Открыть изображение</button></div><div class="hint">Кисть: веди пальцем или мышью · Ctrl+Z — отмена · T — текст</div><div class="toast" id="toast"></div></div></main>
<aside class="side open" id="side"><div class="tabs"><button class="tab active" data-tab="layers">Слои</button><button class="tab" data-tab="tool">Инструмент</button><button class="tab" data-tab="image">Изображение</button></div><div id="panelContent"></div></aside></div></div><input type="file" id="fileInput" accept="image/*" hidden>
<script>
(()=>{const $=id=>document.getElementById(id),canvas=$('art'),ctx=canvas.getContext('2d',{willReadFrequently:true}),wrap=$('canvasWrap'),board=$('board');let tool='brush',color='#252333',size=12,opacity=1,fillShape=false,zoom=1,activeTab='layers',drawing=false,start=null,last=null,selectedLayer=0,history=[],redoStack=[],layers=[],layerSeq=1;
function toast(s){const el=$('toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1900)}
function makeLayer(name='Слой '+layerSeq++,image=null){const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;const x=c.getContext('2d');if(image)x.drawImage(image,0,0,canvas.width,canvas.height);layers.push({name,canvas:c,visible:true,opacity:1});selectedLayer=layers.length-1;renderLayers();compose();return layers[selectedLayer]}
function current(){return layers[selectedLayer]}
function compose(){ctx.clearRect(0,0,canvas.width,canvas.height);for(const l of layers){if(!l.visible)continue;ctx.globalAlpha=l.opacity;ctx.drawImage(l.canvas,0,0)}ctx.globalAlpha=1;$('dimensions').textContent=canvas.width+' × '+canvas.height;$('docName').textContent=layers.length?layers[selectedLayer]?.name||'Изображение':'Пустой проект';}
function snapshot(){history.push(layers.map(l=>({name:l.name,visible:l.visible,opacity:l.opacity,data:l.canvas.toDataURL()})));if(history.length>30)history.shift();redoStack=[]}
function restore(data){layers=[];let pending=data.length; if(!pending){makeLayer();return}data.forEach(d=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;c.getContext('2d').drawImage(img,0,0);layers.push({name:d.name,visible:d.visible,opacity:d.opacity,canvas:c});pending--;if(!pending){selectedLayer=Math.max(0,layers.length-1);renderLayers();compose()}};img.src=d.data})}
function undo(){if(!history.length)return;redoStack.push(layers.map(l=>({name:l.name,visible:l.visible,opacity:l.opacity,data:l.canvas.toDataURL()})));restore(history.pop())}
function redo(){if(!redoStack.length)return;history.push(layers.map(l=>({name:l.name,visible:l.visible,opacity:l.opacity,data:l.canvas.toDataURL()})));restore(redoStack.pop())}
function renderLayers(){if(activeTab!=='layers')return;const c=$('panelContent');c.innerHTML='<div class="section"><h3>Слои изображения</h3><div class="rowbtns"><button class="btn" id="addLayer">＋ Слой</button><button class="btn" id="dupLayer">▣ Копия</button></div></div><div class="section"><div class="layers">'+layers.map((l,i)=>'<div class="layer '+(i===selectedLayer?'active':'')+'" data-layer="'+i+'"><button data-vis="'+i+'" title="Показать/скрыть">'+(l.visible?'◉':'○')+'</button><span class="layer-name">'+escapeHtml(l.name)+'</span><button data-del="'+i+'" title="Удалить слой">×</button></div>').join('')+'</div><p class="empty-note">Верхние слои рисуются поверх нижних. Выбери слой, чтобы рисовать на нём.</p></div><div class="section"><h3>Слой</h3><div class="field"><label>Непрозрачность</label><input id="layerOpacity" type="range" min="0" max="1" step=".01" value="'+(current()?.opacity??1)+'"></div><div class="field"><label>Название</label><input id="layerName" value="'+escapeHtml(current()?.name||'')+'"></div></div>';if($('addLayer'))$('addLayer').onclick=()=>{snapshot();makeLayer();renderLayers();compose()};if($('dupLayer'))$('dupLayer').onclick=()=>{snapshot();const old=current();const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;c.getContext('2d').drawImage(old.canvas,0,0);layers.splice(selectedLayer+1,0,{name:old.name+' копия',canvas:c,visible:true,opacity:old.opacity});selectedLayer++;renderLayers();compose()};c.querySelectorAll('[data-layer]').forEach(el=>el.onclick=e=>{if(e.target.closest('button'))return;selectedLayer=+el.dataset.layer;renderLayers();compose()});c.querySelectorAll('[data-vis]').forEach(b=>b.onclick=e=>{e.stopPropagation();snapshot();layers[+b.dataset.vis].visible=!layers[+b.dataset.vis].visible;renderLayers();compose()});c.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();if(layers.length<2){toast('Нельзя удалить последний слой');return}snapshot();layers.splice(+b.dataset.del,1);selectedLayer=Math.min(selectedLayer,layers.length-1);renderLayers();compose()});if($('layerOpacity'))$('layerOpacity').oninput=e=>{current().opacity=+e.target.value;compose()};if($('layerName'))$('layerName').onchange=e=>{current().name=e.target.value||'Слой';renderLayers();compose()}}
function renderTool(){const c=$('panelContent');c.innerHTML='<div class="section"><h3>Настройки инструмента</h3><div class="field"><label>Цвет</label><input id="color" type="color" value="'+color+'"></div><div class="field"><label>Размер</label><input id="size" type="range" min="1" max="100" value="'+size+'"></div><div class="field"><label>Размер, px</label><input id="sizeNum" type="number" min="1" max="300" value="'+size+'"></div><div class="field"><label>Непрозрачность</label><input id="opacity" type="range" min="0.05" max="1" step=".05" value="'+opacity+'"></div><label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input id="fillShape" type="checkbox" '+(fillShape?'checked':'')+'> Заливать фигуры</label></div><div class="section"><h3>Быстрые цвета</h3><div class="color-swatches">'+['#252333','#ffffff','#f87171','#fb923c','#facc15','#4ade80','#2dd4bf','#60a5fa','#818cf8','#c084fc','#f472b6','#111827'].map(c=>'<button class="swatch" data-color="'+c+'" style="background:'+c+'" title="'+c+'"></button>').join('')+'</div></div><div class="section"><h3>Инструмент</h3><p class="empty-note">'+({brush:'Рисование свободной линией.',eraser:'Стирает пиксели текущего слоя.',line:'Рисует прямую линию.',rect:'Рисует прямоугольник.',ellipse:'Рисует эллипс.',text:'Добавляет текст в указанную точку.'})[tool]+'</p></div>';if($('color'))$('color').oninput=e=>color=e.target.value;if($('size'))$('size').oninput=e=>{size=+e.target.value;if($('sizeNum'))$('sizeNum').value=size};if($('sizeNum'))$('sizeNum').onchange=e=>{size=Math.max(1,Math.min(300,+e.target.value||1));renderTool()};if($('opacity'))$('opacity').oninput=e=>opacity=+e.target.value;if($('fillShape'))$('fillShape').onchange=e=>fillShape=e.target.checked;c.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{color=b.dataset.color;renderTool()})}
function renderImage(){const c=$('panelContent');c.innerHTML='<div class="section"><h3>Размер холста</h3><div class="field"><label>Ширина</label><input id="width" type="number" min="1" max="5000" value="'+canvas.width+'"></div><div class="field"><label>Высота</label><input id="height" type="number" min="1" max="5000" value="'+canvas.height+'"></div><button class="btn primary" id="resizeCanvas">Изменить размер</button></div><div class="section"><h3>Эффекты</h3><div class="field"><label>Фильтр</label><select id="filter"><option value="none">Без фильтра</option><option value="grayscale(1)">Чёрно-белый</option><option value="sepia(1)">Сепия</option><option value="contrast(1.35)">Контраст</option><option value="saturate(1.8)">Насыщенность</option><option value="blur(1.5px)">Мягкое размытие</option><option value="invert(1)">Инверсия</option></select></div><button class="btn primary" id="applyFilter">Применить к слою</button><button class="btn" id="resetFilter" style="margin-left:5px">Сброс</button></div><div class="section"><h3>Быстрые действия</h3><div class="rowbtns"><button class="btn" id="flipH">↔ Отразить</button><button class="btn" id="rotate90">↻ 90°</button></div><p class="empty-note">Фильтры применяются к выбранному слою. Перед изменениями можно отменить действие сочетанием Ctrl+Z.</p></div>'; $('resizeCanvas').onclick=()=>{const w=Math.max(1,Math.min(5000,+$('width').value||1)),h=Math.max(1,Math.min(5000,+$('height').value||1));snapshot();const old=layers.map(l=>({name:l.name,visible:l.visible,opacity:l.opacity,canvas:l.canvas}));canvas.width=w;canvas.height=h;layers=old.map(l=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(l.canvas,0,0,w,h);return {...l,canvas:c}});compose();renderImage();fitCanvas()};$('applyFilter').onclick=()=>{snapshot();const l=current(),x=l.canvas.getContext('2d'),img=new Image();img.onload=()=>{x.clearRect(0,0,l.canvas.width,l.canvas.height);x.filter=$('filter').value==='none'?'none':$('filter').value;x.drawImage(img,0,0);x.filter='none';compose();toast('Эффект применён')};img.src=l.canvas.toDataURL()};$('resetFilter').onclick=()=>{$('filter').value='none'};$('flipH').onclick=()=>{snapshot();const l=current(),x=l.canvas.getContext('2d'),tmp=document.createElement('canvas');tmp.width=canvas.width;tmp.height=canvas.height;tmp.getContext('2d').translate(canvas.width,0);tmp.getContext('2d').scale(-1,1);const tx=tmp.getContext('2d');tx.translate(canvas.width,0);tx.scale(-1,1);tx.drawImage(l.canvas,0,0);x.clearRect(0,0,canvas.width,canvas.height);x.drawImage(tmp,0,0);compose()};$('rotate90').onclick=()=>{snapshot();const l=current(),tmp=document.createElement('canvas');tmp.width=canvas.height;tmp.height=canvas.width;const t=tmp.getContext('2d');t.translate(tmp.width/2,tmp.height/2);t.rotate(Math.PI/2);t.drawImage(l.canvas,-canvas.width/2,-canvas.height/2);const w=canvas.width,h=canvas.height;canvas.width=h;canvas.height=w;layers.forEach(a=>{const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;c.getContext('2d').drawImage(tmp,0,0);a.canvas=c});compose();renderImage();fitCanvas()}}
function renderPanel(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));if(activeTab==='layers')renderLayers();else if(activeTab==='tool')renderTool();else renderImage()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fitCanvas(){const maxW=Math.max(100,board.clientWidth-30),maxH=Math.max(100,board.clientHeight-30);zoom=Math.min(maxW/canvas.width,maxH/canvas.height,1);setZoom(zoom)}
function setZoom(z){zoom=Math.max(.1,Math.min(2,z));wrap.style.width=(canvas.width*zoom)+'px';wrap.style.height=(canvas.height*zoom)+'px';canvas.style.width='100%';canvas.style.height='100%';$('zoomLabel').textContent=Math.round(zoom*100)+'%'}
function point(e){const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}
function drawSegment(a,b){const c=current().canvas.getContext('2d');c.save();c.globalAlpha=opacity;c.strokeStyle=tool==='eraser'?'rgba(0,0,0,1)':color;c.fillStyle=color;c.lineWidth=size;c.lineCap='round';c.lineJoin='round';if(tool==='eraser')c.globalCompositeOperation='destination-out';if(tool==='brush'||tool==='eraser'){c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}c.restore()}
function shape(a,b,preview=false){const c=(preview?ctx:current().canvas.getContext('2d'));if(preview)compose();c.save();c.globalAlpha=opacity;c.strokeStyle=color;c.fillStyle=color;c.lineWidth=size;c.beginPath();if(tool==='line'){c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke()}else if(tool==='rect'){if(fillShape)c.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);else c.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y)}else if(tool==='ellipse'){c.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.abs(b.x-a.x)/2,Math.abs(b.y-a.y)/2,0,0,Math.PI*2);fillShape?c.fill():c.stroke()}c.restore()}
canvas.addEventListener('pointerdown',e=>{if(!layers.length)makeLayer();if(tool==='text'){const p=point(e),txt=prompt('Текст для изображения:');if(txt){snapshot();const c=current().canvas.getContext('2d');c.save();c.globalAlpha=opacity;c.fillStyle=color;c.font='bold '+Math.max(12,size*3)+'px system-ui';c.textBaseline='top';txt.split('\n').forEach((line,i)=>c.fillText(line,p.x,p.y+i*Math.max(12,size*3)*1.2));c.restore();compose()}return}drawing=true;start=last=point(e);canvas.setPointerCapture(e.pointerId);snapshot();if(tool==='brush'||tool==='eraser')drawSegment(start,{x:start.x+.01,y:start.y+.01})});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);if(tool==='brush'||tool==='eraser'){drawSegment(last,p);last=p;compose()}else shape(start,p,true)});
function endDraw(e){if(!drawing)return;const p=point(e);if(['line','rect','ellipse'].includes(tool)){shape(start,p,false);compose()}drawing=false;start=last=null}canvas.addEventListener('pointerup',endDraw);canvas.addEventListener('pointercancel',endDraw);
function setTool(t){tool=t;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));activeTab='tool';renderPanel()}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;renderPanel()});
$('undoBtn').onclick=undo;$('redoBtn').onclick=redo;$('clearBtn').onclick=()=>{snapshot();current().canvas.getContext('2d').clearRect(0,0,canvas.width,canvas.height);compose()};$('zoomIn').onclick=()=>setZoom(zoom*1.2);$('zoomOut').onclick=()=>setZoom(zoom/1.2);$('fitBtn').onclick=fitCanvas;$('panelBtn').onclick=()=>$('side').classList.toggle('open');
function newDoc(){if(!confirm('Создать новый холст? Несохранённые изменения будут потеряны.'))return;const w=Math.max(1,Math.min(5000,+(prompt('Ширина холста в пикселях','1200')||1200)),h=Math.max(1,Math.min(5000,+(prompt('Высота холста в пикселях','800')||800)));canvas.width=w;canvas.height=h;layers=[];history=[];redoStack=[];makeLayer('Фон');renderPanel();compose();fitCanvas();$('welcome').classList.remove('hidden')}
$('newBtn').onclick=newDoc;$('startBtn').onclick=()=>{$('welcome').classList.add('hidden');toast('Холст готов — выбери кисть слева')};
function importImage(file){if(!file)return;const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{snapshot();if(!layers.length){canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;layers=[]}const c=document.createElement('canvas');c.width=canvas.width;c.height=canvas.height;c.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);layers.push({name:file.name.replace(/\.[^.]+$/,'')||'Импорт',canvas:c,visible:true,opacity:1});selectedLayer=layers.length-1;URL.revokeObjectURL(url);renderPanel();compose();fitCanvas();$('welcome').classList.add('hidden');toast('Изображение импортировано')};img.onerror=()=>{URL.revokeObjectURL(url);toast('Не удалось открыть изображение')};img.src=url}
$('openBtn').onclick=()=>$('fileInput').click();$('welcomeImport').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>{importImage(e.target.files[0]);e.target.value=''};
$('saveBtn').onclick=()=>{compose();const a=document.createElement('a');a.download='pixel-studio.png';a.href=canvas.toDataURL('image/png');a.click();toast('PNG экспортирован')};
window.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo()}else if(e.ctrlKey&&e.key.toLowerCase()==='y'){e.preventDefault();redo()}else if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;else{const k=e.key.toLowerCase();if(k==='b')setTool('brush');else if(k==='e')setTool('eraser');else if(k==='l')setTool('line');else if(k==='u')setTool('rect');else if(k==='o')setTool('ellipse');else if(k==='t')setTool('text')}});
makeLayer('Слой 1');renderPanel();compose();fitCanvas();window.addEventListener('resize',fitCanvas);})();
</script></body></html>
