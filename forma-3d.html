absolute;bottom:12px;left:14px;z-index:2;color:#c0c4cb;background:#24262ac9;padding:7px 10px;border-radius:5px;font-size:11px;pointer-events:none}.axis{position:absolute;right:14px;bottom:15px;z-index:2;width:72px;height:72px;pointer-events:none;opacity:.9}.side{background:#292b30;border-left:1px solid #17181b;overflow:auto;min-width:0}.sidehead{height:43px;display:flex;align-items:center;padding:0 13px;border-bottom:1px solid #17181b;font-weight:750;letter-spacing:.2px}.tabs{display:flex;border-bottom:1px solid #17181b}.tab{flex:1;border:0;border-bottom:2px solid transparent;background:transparent;padding:11px 5px;color:#aeb2ba}.tab.active{border-bottom-color:var(--orange);color:#fff}.section{padding:12px;border-bottom:1px solid #41444b}.secttitle{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:750;margin-bottom:11px}.smallbtn{border:1px solid #4a4e57;background:#373a41;border-radius:5px;padding:5px 8px}.objectlist{display:grid;gap:3px}.objrow{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:5px;color:#d6d8dd;cursor:pointer}.objrow:hover{background:#35383f}.objrow.selected{background:#4a4035;outline:1px solid #8c5a2e}.objicon{width:20px;text-align:center;color:var(--orange)}.objname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.field{display:grid;grid-template-columns:68px minmax(0,1fr);gap:7px;align-items:center;margin:8px 0}.field label{color:#b6bac2;font-size:11px}.field input,.field select{width:100%;min-width:0;background:#1f2126;border:1px solid #4a4e56;border-radius:5px;padding:6px 7px;color:#eee}.xyz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}.xyz input{width:100%;min-width:0;background:#1f2126;border:1px solid #4a4e56;border-radius:5px;padding:6px 4px;color:#eee;text-align:center}.xyz input:focus,.field input:focus{outline:1px solid var(--orange)}.xyz .x{border-top:2px solid #e16b6b}.xyz .y{border-top:2px solid #8bcf8b}.xyz .z{border-top:2px solid #6ca <body>
<header class="topbar"><div class="logo">F</div><div class="brand">FORMA <span>3D</span></div><nav class="menu"><button id="fileMenu">Файл ▾</button><button id="addMenu">Добавить ▾</button><button id="help">Справка</button></nav><div class="topright"><button class="action hide-small" id="newScene">Новая сцена</button><button class="action" id="importBtn">↑ Импорт</button><button class="action primary" id="exportBtn">↓ Экспорт .json</button><button class="action" id="panelBtn">Панель</button></div></header>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js';
const $=id=>document.getElementById(id);
const viewport=$('viewport');
const scene=new THREE.Scene();scene.background=new THREE.Color('#34373d');
const camera=new THREE.PerspectiveCamera(48,1,.1,1000);camera.position.set(7,6,9);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;viewport.appendChild(renderer.domElement);
renderer.domElement.style.width='100%';renderer.domElement.style.height='100%';renderer.domElement.style.display='block';
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.enableDamping=true;controls.dampingFactor=.07;
scene.add(new THREE.HemisphereLight(0xcbdcff,0x45404a,2));
const keyLight=new THREE.DirectionalLight(0xffe1c3,3);keyLight.position.set(5,9,5);keyLight.castShadow=true;scene.add(keyLight);
const fillLight=new THREE.DirectionalLight(0x86aaff,1.5);fillLight.position.set(-5,3,-4);scene.add(fillLight);
const grid=new THREE.GridHelper(20,20,0x707680,0x50545b);grid.position.y=-.001;scene.add(grid);
const axes=new THREE.AxesHelper(1.6);scene.add(axes);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.ShadowMaterial({opacity:.12}));floor.rotation.x=-Math.PI/2;floor.position.y=-.015;floor.receiveShadow=true;scene.add(floor);
const objects=[];let selected=null,tool='select',idCounter=1,activeTab='scene';const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
const geometryFactories={cube:()=>new THREE.BoxGeometry(2,2,2),sphere:()=>new THREE.SphereGeometry(1,32,20),cylinder:()=>new THREE.CylinderGeometry(1,1,2,32),cone:()=>new THREE.ConeGeometry(1,2,32)};
const typeNames={cube:'Куб',sphere:'Сфера',cylinder:'Цилиндр',cone:'Конус'};
function toast(msg){$('status').textContent=msg;$('status').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('status').classList.remove('show'),2100)}
function addObject(type='cube',data={}){const geo=geometryFactories[type]?.()||geometryFactories.cube();const mat=new THREE.MeshStandardMaterial({color:data.color|| (type==='sphere'?'#75a7e8':'#e7a05b'),roughness:data.roughness??.52,metalness:data.metalness??.08});const mesh=new THREE.Mesh(geo,mat);mesh.name=data.name||typeNames[type]+' '+idCounter++;mesh.userData.formaType=type;mesh.position.set(...(data.position||[0,1,0]));mesh.rotation.set(...(data.rotation||[0,0,0]));mesh.scale.set(...(data.scale||[1,1,1]));mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);objects.push(mesh);select(mesh);renderObjectList();return mesh}
function select(obj){selected=obj;renderObjectList();renderProperties()}
function renderObjectList(){const box=document.getElementById('objectList');if(box){box.innerHTML=objects.length?objects.map((o,i)=>'<div class="objrow '+(o===selected?'selected':'')+'" data-index="'+i+'"><span class="objicon">'+({cube:'▣',sphere:'◉',cylinder:'⬭',cone:'△'}[o.userData.formaType]||'◇')+'</span><span class="objname">'+escapeHtml(o.name)+'</span><span style="color:#8f949d">◈</span></div>').join(''):'<p class="empty">Сцена пока пуста. Добавь первый объект с панели слева.</p>';box.querySelectorAll('.objrow').forEach(row=>row.onclick=()=>select(objects[+row.dataset.index]));}$('objectCount').textContent=objects.length+' объектов';
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderProperties(){const c=$('tabContent');if(activeTab==='scene'){c.innerHTML='<div class="section"><div class="secttitle">Иерархия сцены <button class="smallbtn" id="sceneAdd">＋ Добавить</button></div><div id="objectList" class="objectlist"></div></div><div class="section"><div class="secttitle">Настройки сцены</div><div class="field"><label>Фон</label><input id="bgColor" type="color" value="#34373d"></div><div class="field"><label>Сетка</label><select id="gridToggle"><option value="on">Показать</option><option value="off">Скрыть</option></select></div><p class="empty">Выбери объект в списке или в 3D-окне. Используй экспорт, чтобы сохранить сцену в JSON.</p></div>';renderObjectList();$('sceneAdd').onclick=()=>showAddMenu();$('bgColor').oninput=e=>scene.background.set(e.target.value);$('gridToggle').onchange=e=>grid.visible=e.target.value==='on';return}
if(!selected){c.innerHTML='<div class="section"><p class="empty">Выбери объект в 3D-окне или в иерархии сцены, чтобы редактировать его свойства.</p><button class="action full" id="addFirst">＋ Создать куб</button></div>';if($('addFirst'))$('addFirst').onclick=()=>addObject('cube');return}
if(activeTab==='object'){c.innerHTML='<div class="section"><div class="secttitle">Объект</div><div class="field"><label>Имя</label><input id="objName" value="'+escapeHtml(selected.name)+'"></div><div class="field"><label>Тип</label><input disabled value="'+(typeNames[selected.userData.formaType]||'Объект')+'"></div></div>'+['position','rotation','scale'].map((p)=>'<div class="section"><div class="secttitle">'+({position:'Положение',rotation:'Вращение (°)',scale:'Масштаб'}[p])+' <button class="smallbtn" data-reset="'+p+'">Сброс</button></div><div class="xyz">'+['x','y','z'].map((axis,i)=>'<input class="'+axis+'" type="number" step="'+(p==='rotation'?5:.1)+'" data-prop="'+p+'" data-axis="'+i+'" value="'+(p==='rotation'?(selected[p][axis]*180/Math.PI).toFixed(1):selected[p][axis].toFixed(2))+'" aria-label="'+p+' '+axis+'">').join('')+'</div></div>').join('')+'<div class="section"><button class="action full" id="duplicate">▣ Дублировать объект</button><button class="action full" id="deleteFromProps" style="margin-top:7px">⌫ Удалить объект</button></div>'; $('objName').onchange=e=>{selected.name=e.target.value||'Объект';renderObjectList()};c.querySelectorAll('[data-prop]').forEach(inp=>inp.onchange=()=>{let p=inp.dataset.prop,ax=+inp.dataset.axis,v=+inp.value;if(Number.isFinite(v)){if(p==='rotation')v=v*Math.PI/180;selected[p].setComponent(ax,v);}});c.querySelectorAll('[data-reset]').forEach(b=>b.onclick=()=>{let p=b.dataset.reset;if(p==='scale')selected.scale.set(1,1,1);else selected[p].set(0,0,0);renderProperties()});$('duplicate').onclick=()=>{const d=selected.clone();d.material=selected.material.clone();d.name=selected.name+' copy';d.position.x+=1;d.userData={...selected.userData};scene.add(d);objects.push(d);select(d);toast('Объект дублирован')};$('deleteFromProps').onclick=deleteSelected;return}
c.innerHTML='<div class="section"><div class="secttitle">Поверхность</div><div class="field"><label>Основной цвет</label><input id="matColor" type="color" value="#'+selected.material.color.getHexString()+'"></div><div class="field"><label>Шероховатость</label><input id="rough" type="range" min="0" max="1" step=".01" value="'+selected.material.roughness+'"></div><div class="field"><label>Металличность</label><input id="metal" type="range" min="0" max="1" step=".01" value="'+selected.material.metalness+'"></div><p class="empty">Материал использует физическую модель освещения Three.js.</p></div><div class="section"><div class="secttitle">Быстрые материалы</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">'+['#e7a05b','#75a7e8','#8fcf9a','#d889e8','#e7e8eb','#252a33','#e85c5c','#f1d66b'].map(col=>'<button class="smallbtn" data-color="'+col+'" style="height:30px;background:'+col+';border-color:'+col+'" title="'+col+'"></button>').join('')+'</div></div>';
$('matColor').oninput=e=>selected.material.color.set(e.target.value);$('rough').oninput=e=>selected.material.roughness=+e.target.value;$('metal').oninput=e=>selected.material.metalness=+e.target.value;c.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{selected.material.color.set(b.dataset.color);renderProperties()})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));renderProperties()});
function addType(t){const o=addObject(t);activeTab='object';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='object'));renderProperties();toast(typeNames[t]+' добавлен');}
$('addCube').onclick=()=>addType('cube');$('addSphere').onclick=()=>addType('sphere');$('addCylinder').onclick=()=>addType('cylinder');$('addCone').onclick=()=>addType('cone');
function deleteSelected(){if(!selected)return;scene.remove(selected);const i=objects.indexOf(selected);if(i>=0)objects.splice(i,1);selected=null;renderObjectList();renderProperties();toast('Объект удалён')}
$('deleteObj').onclick=deleteSelected;$('focusObj').onclick=()=>{if(selected){controls.target.copy(selected.position);camera.position.copy(selected.position).add(new THREE.Vector3(5,4,6));controls.update()}};
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));toast(({select:'Режим выбора',move:'Режим перемещения: редактируй координаты во вкладке «Объект»',rotate:'Режим вращения: редактируй углы во вкладке «Объект»',scale:'Режим масштаба: редактируй размеры во вкладке «Объект»'})[tool])});
renderer.domElement.addEventListener('pointerdown',e=>{const rect=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-rect.left)/rect.width)*2-1;pointer.y=-((e.clientY-rect.top)/rect.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(objects,false);if(hits.length)select(hits[0].object);});
function showAddMenu(){showModal('Добавить объект','Выбери примитив на левой панели: куб, сферу, цилиндр или конус. Новые объекты появляются в центре сцены.')}
$('addMenu').onclick=showAddMenu;$('fileMenu').onclick=()=>showModal('Файл проекта','Экспорт сохраняет объекты, координаты, вращение, масштаб и материалы в JSON-файл. Импортируй этот файл, чтобы продолжить работу в Forma 3D.');$('help').onclick=()=>showModal('Forma 3D — быстрый старт','Добавь объект слева. Вращай вид мышью, приближай колёсиком. Во вкладке «Объект» меняй положение, вращение и масштаб; во вкладке «Материал» настраивай цвет и поверхность. Кнопка «Экспорт .json» сохраняет сцену в файл. Это ранний прототип: редактирование сетки, скульптинг и экспорт GLB пока не реализованы.');
function showModal(title,text){$('modalTitle').textContent=title;$('modalText').textContent=text;$('modal').classList.add('open')}$('modalClose').onclick=()=>$('modal').classList.remove('open');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('open')};
$('panelBtn').onclick=()=>$('side').classList.toggle('open');$('viewFront').onclick=()=>{camera.position.set(0,2,12);controls.target.set(0,0,0);controls.update()};$('viewTop').onclick=()=>{camera.position.set(0,15,.001);controls.target.set(0,0,0);controls.update()};$('viewHome').onclick=()=>{camera.position.set(7,6,9);controls.target.set(0,0,0);controls.update()};
$('newScene').onclick=()=>{if(confirm('Создать новую пустую сцену? Несохранённые изменения будут потеряны. Сначала экспортируй проект, если хочешь его сохранить.')){objects.slice().forEach(o=>scene.remove(o));objects.length=0;selected=null;renderObjectList();renderProperties();toast('Создана пустая сцена')}};
function exportScene(){const data={format:'Forma3D',version:1,createdAt:new Date().toISOString(),background:'#'+scene.background.getHexString(),objects:objects.map(o=>({type:o.userData.formaType,name:o.name,position:o.position.toArray(),rotation:o.rotation.toArray().slice(0,3),scale:o.scale.toArray(),color:'#'+o.material.color.getHexString(),roughness:o.material.roughness,metalness:o.material.metalness}))};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='forma3d-scene.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Сцена экспортирована в JSON')}
$('exportBtn').onclick=exportScene;$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=async e=>{const file=e.target.files?.[0];if(!file)return;try{const d=JSON.parse(await file.text());if(d.format!=='Forma3D'||!Array.isArray(d.objects))throw Error('Неподдерживаемый формат');objects.slice().forEach(o=>scene.remove(o));objects.length=0;selected=null;for(const x of d.objects){if(!geometryFactories[x.type])continue;addObject(x.type,{...x,position:x.position,rotation:x.rotation,scale:x.scale,color:x.color});const o=objects[objects.length-1];o.name=String(x.name||o.name).slice(0,100);o.material.roughness=Math.max(0,Math.min(1,+x.roughness||0));o.material.metalness=Math.max(0,Math.min(1,+x.metalness||0));}if(d.background)scene.background.set(d.background);select(objects[0]||null);toast('Импортировано объектов: '+objects.length)}catch(err){showModal('Не удалось импортировать','Файл не похож на корректный проект Forma 3D. Выбери JSON, ранее сохранённый из Forma 3D.')}e.target.value=''};
function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;if(!w||!h)return;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}new ResizeObserver(resize).observe(viewport);resize();
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
addObject('cube',{name:'Cube',position:[0,1,0],color:'#e7a05b'});addObject('sphere',{name:'Sphere',position:[2.5,1,0],color:'#75a7e8'});addObject('cylinder',{name:'Cylinder',position:[-2.5,1,0],color:'#8fcf9a'});select(objects[0]);activeTab='scene';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab==='scene'));renderProperties();
</script>
</body></html>
